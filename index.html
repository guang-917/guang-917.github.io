/* ===== 作答要求（对齐「定时任务正式推送卡片」的排版：摘要 → 导读 → 要点 → 标签）=====
   背景（.28 重构）：原先这套模板写死了「要点 3~5 条、每条不超过 45 字」「每条必须一行写完」，
   于是全文上限只有约 225 字——实测问「FDE 和 AIGC 的区别」，AI 被逼得只写得出
   「区别：用途不同、技术不同、结果不同」这种说了等于没说的一句话（用户反馈"太简短、反而创造新疑惑"）。
   现在改成：**先判断问题属于哪一类、再按那一类把话说透**，条数与篇幅不再设上限（只防灌水）。
   骨架仍然保留（摘要 / 导读 / 要点 / 标签），因为前端要按这个骨架排版。 */
var AI_ANS_FMT = "\n\n【作答要求｜优先于你平时的表达习惯】\n"
 + "★ 第一句必须是结论。用一句话把「这是什么／答案是什么」说清楚——不许铺垫、不许开场白、不许写「这个问题很有意义」「该问题探讨了…」。\n"

 + "★ 说人话。每一句都要有实质信息，禁止「有助于深入理解…」「具有重要意义…」这类空话；宁可少说一句，也不拿套话凑数。\n"
 + "★ 不确定就直说。拿不准的事实、数据、年份、人名，写「这点我不确定」或整句不写，绝不许为了显得完整而编造。\n"
 + "★ 缩写/多义词：先写全称；有多种含义就全列出来，并说明「你问的若是 X 领域，指的就是第 N 个」；拿不准就反问一句。\n"
 + "篇幅由问题决定：该长就长、该短就短，不为凑字数灌水。\n"
 + "\n【输出格式｜必须照这个骨架写，App 靠它排版】\n"
 + "结论：（一句话，完整通顺，不许截断，也不许把正文第一条抄过来）\n"
 + "正文：（紧接着写展开内容。可以分段，也可以用「- 」分点；条数不限，够说清就行）\n"
 + "标签：（关键词一、关键词二、关键词三）\n"
 + "硬性要求：① 只写「结论 / 正文 / 标签」三段，**不要写「导读」**；② 不要开场白和结束语；③ 不要用 markdown 符号（#、**、```），分点用「- 」；④ 每条都要有实质内容，说不清就不写。";
/* ===== 把 AI 的回答解析成「正式卡片」结构：{sum, lead, body[], tags[]} =====
   模型偶尔不按格式来 → 自动降级：按句号切段，保证界面上不会再出现"一整坨不分段"的文字。 */
function parseAnsCard(text){
  var raw=String(text||"").replace(/\r\n?/g,"\n").trim();
  /* 洗掉模型可能带出来的 markdown 噪音 */
  var clean=raw.replace(/```[a-zA-Z]*\n?/g,"").replace(/\*\*/g,"").replace(/^\s*#{1,6}\s*/gm,"").replace(/`/g,"").trim();
  var o={sum:"",lead:"",body:[],tags:[],raw:clean,fmt:false};
  function pick(line,names){
    for(var i=0;i<names.length;i++){
      var m=new RegExp("^\\s*[【\\[]?\\s*"+names[i]+"\\s*[】\\]]?\\s*[：:]\\s*(.*)$").exec(line);
      if(m)return m[1].trim();
    }
    return null;
  }
  function splitTags(s){ return String(s||"").split(/[、,，\/|;；]+/).map(function(x){return x.trim();}).filter(Boolean); }
  var cur=null,buf=[];
  function flush(){ if(cur==="body"&&buf.length){o.body=o.body.concat(buf);} buf=[]; }
  var lines=clean.split("\n");
  for(var i=0;i<lines.length;i++){
    var rawLine=lines[i].trim(); if(!rawLine)continue;
    /* 【关键】先剥掉行首的项目符号，再去认「摘要/导读/标签」——
       否则模型写成「- 标签：a、b」时，标签会被当成第 N 条要点，标签就丢了。 */
    /* 【.28 修】行首编号不再强制要求「后面跟空格」：中文里常见的「1、第一步：…」不带空格，
       以前认不出来 → 被当成普通行 → 紧跟在「摘要」后面就被并进摘要里（整篇回答会被吸进摘要）。
       为避免误判（如「3.5 万亿元」），编号后面要么是空白、要么是中文或左括号。 */
    var BUL=/^(?:[-*•]|\d{1,2}\s*[.、)）])(?:\s+|(?=[\u4e00-\u9fa5「『（(]))/;
    var isBullet=BUL.test(rawLine);
    var t=isBullet?rawLine.replace(BUL,"").trim():rawLine;
    if(!t)continue;
    var v;
    if((v=pick(t,["摘要","一句话摘要","结论"]))!==null){ flush(); cur="sum"; o.sum=v; o.fmt=true; continue; }
    if((v=pick(t,["导读","导语","引子"]))!==null){ flush(); cur="lead"; o.lead=v; o.fmt=true; continue; }
    if((v=pick(t,["标签","关键词","tags"]))!==null){ flush(); cur="tag"; o.tags=o.tags.concat(splitTags(v)); o.fmt=true; continue; }
    if((v=pick(t,["要点","正文","具体来说"]))!==null){ flush(); cur="body"; if(v)buf.push(v); o.fmt=true; continue; }
    if(isBullet){ if(cur!=="body"){flush();cur="body";} buf.push(t); o.fmt=true; continue; }
    /* 没有任何前缀的普通行：跟在上一个字段后面就并入它 */
    if(cur==="sum"){
      /* 【.28 护栏】摘要最多吸收到 80 字；再长就说明这行不是摘要的续写（多半是没被认出编号的正文行），
         转成正文，避免整篇回答被吸进摘要里。 */
      if(o.sum.length<80) o.sum+=t;
      else { flush(); cur="body"; buf.push(t); }
    }
    else if(cur==="lead"){ o.lead+=t; }
    else if(cur==="tag"){ o.tags=o.tags.concat(splitTags(t)); }
    else { if(cur!=="body"){flush();cur="body";} buf.push(t); }
  }
  flush();
  /* 降级一：只有一条要点又特别长 → 仍按句号拆开 */
  if(o.body.length===1&&o.body[0].length>90){
    var one=o.body[0];
    o.body=one.split("。").map(function(s){return s.trim();}).filter(Boolean).map(function(s){return s+"。";});
  }
  /* 降级二：模型完全没按格式来 → 整段按句号切段，别让它变成一整坨 */
  if(!o.fmt&&o.body.length<=1){
    var parts=clean.split("。").map(function(s){return s.trim();}).filter(Boolean).map(function(s){return s+"。";});
    o.sum=""; o.lead=""; o.body=parts.length?parts:(clean?[clean]:[]);
  }
  /* 合并：模型有时把「小标题」和「说明」写成两行 → 合成一条（否则条数会虚高、看着零碎） */
  var GENERIC=/^(?:小?标题|要点|内容|说明|正文)\s*[：:]\s*/;
  var merged=[];
  for(var j=0;j<o.body.length;j++){
    var cur=String(o.body[j]||"").trim(), nx=o.body[j+1]?String(o.body[j+1]).trim():"";
    var curFrag = !!cur && !/[。！？!?；;]$/.test(cur) && cur.length<=18;
    var nxIsDesc = !!nx && /[。！？!?]$/.test(nx) && nx.length>cur.length;
    if(curFrag && nxIsDesc){ merged.push(cur.replace(GENERIC,"").trim()+"："+nx); j++; }
    else { merged.push(cur.replace(GENERIC,"").trim()||cur); }
  }
  /* 【.28 改】不再把要点砍到 5 条：条数由问题决定，砍掉就等于丢信息（见 AI_ANS_FMT 上方说明） */
  o.body=merged.filter(Boolean);
  o.tags=o.tags.slice(0,4);
  /* 【重要】这里不再「抓要点第一句硬切 60 字」冒充摘要（那会把一句话拦腰截断，
     正是「摘要显示不全」的病根）。摘要必须由 AI 总结得出：解析不到就留空，
     交给 ensureSummary() 单独再向 AI 要一次；最终仍失败才退到「完整第一句」。 */
  o.sum=String(o.sum||"").trim();
  if(!o.body.length&&clean) o.body=[clean];
  return o;
}
/* ===== 摘要一定要「AI 总结」出来，绝不前端硬切 =====
   背景：AI 偶尔会漏掉「摘要」那一行。老做法是抓要点第一句切 60 字顶上——
   那等于把一句话拦腰截断（曾出现「…（如数据仓库、数」这种半句话），
   跟"摘要页"的初衷完全相反。现在改成：
     ① AI 这轮给了摘要 → 直接用；
     ② 没给 → 拿这次的完整回答（+ 来源卡内容）单独再向 AI 要一句总结（真总结）；
     ③ 连补调也失败 → 退到「完整第一句」（按句末标点收口，不切断），宁可长一点也不给半句话。 */
function aiSummarize(src, title){
  var text = String(src || "").trim();
  if (!text) return Promise.resolve("");
  var prompt = (title ? ("标题：" + title + "\n") : "") + "内容：\n" + text.slice(0, 1500);
  return callAI(prompt,
    "你是个人知识助教。请把用户给你的内容总结成一句话摘要。只输出这句摘要本身："
    + "不要任何前缀字样（不要写「摘要：」）、不要分点、不要 markdown、不要加引号。"
    + "要求：意思完整、通顺；不限字数，但尽量简短。"
    + "如果内容确实不足以做总结，就只输出四个字：信息不足。",
    true
  ).then(function(s){
    s = String(s || "").replace(/\s+/g, " ").trim();
    s = s.replace(/^(?:摘要|一句话摘要|总结|概括|概要)\s*[：:]\s*/, "");
    s = s.replace(/^[「『"“]+|["”」』]+$/g, "").trim();
    if (!s || s.length < 4 || /^信息不足/.test(s)) return "";
    return s.replace(/[。；;]$/, "");
  }).catch(function(){ return ""; });
}
/* 最后兜底：取「完整的第一句」（按句末标点收口，绝不切断）。比留空强，也绝不是半句话。 */
function firstFullSentence(p){
  var f = String((p && ((p.body && p.body[0]) || p.raw)) || "").trim();
  if (!f) return "";
  var m = /^[^。！？!?]*[。！？!?]/.exec(f);
  return (m ? m[0] : f).replace(/[。；;！!？?]$/, "").trim();
}
/* 摘要关卡：AI 这轮没给摘要时，去补一次真总结。返回补齐后的 p（p.sumSrc 标记来源，便于自检）。 */
function ensureSummary(p, card, answerText){
  if (!p) return Promise.resolve(p);
  if (String(p.sum || "").trim()) { p.sumSrc = "ai-card"; return Promise.resolve(p); }
  var src = [];
  if (card){
    if (card.title) src.push("标题：" + card.title);
    if (card.lead) src.push("导读：" + card.lead);
    if (card.body && card.body.length) src.push(card.body.join("\n"));
  }
  if (answerText) src.push(String(answerText));
  src = src.join("\n").trim();
  if (!src) { p.sum = ""; p.sumSrc = "none"; return Promise.resolve(p); }
  return aiSummarize(src, card && card.title ? String(card.title) : "").then(function(s){
    if (s){ p.sum = s; p.sumSrc = "ai-summarize"; }
    else { p.sum = firstFullSentence(p); p.sumSrc = p.sum ? "fallback" : "none"; }
    return p;
  });
}
/* ===== 把解析结果渲染成 HTML（摘要 / 导读 / 分点 / 标签）===== */
/* ===== 长回答折叠（.28）=====
   答案变长之后，一屏塞不下会把下面的内容顶走。做法：正文先露一截（.coll 限高 + 底部渐隐），
   底下给一个「展开完整回答」；**内容没超出就不显示按钮**（靠真实高度量，不靠字数猜）。
   量高度不受 transform 缩放影响，所以阅读器还在做展开动画时也能量准。 */
function fitCollapse(root){
  var rs=(root||document).querySelectorAll(".coll");
  for(var i=0;i<rs.length;i++){
    var el=rs[i];
    var over=el.scrollHeight>el.clientHeight+4;
    el.classList.toggle("can",over);
    var btn=el.nextElementSibling;
    if(btn&&btn.classList&&btn.classList.contains("cbtn")){
      btn.classList.toggle("on",over);
      if(over&&!el.classList.contains("open"))btn.textContent="展开完整回答（还有下文）";
      else if(over)btn.textContent="收起";
    }
  }
}
document.addEventListener("click",function(e){
  var b=e.target.closest(".cbtn"); if(!b)return;
  var col=b.previousElementSibling; if(!col||!col.classList.contains("coll"))return;
  var open=col.classList.toggle("open");
  b.textContent=open?"收起":"展开完整回答（还有下文）";
  e.preventDefault();e.stopPropagation();
});

function ansHTML(p){
  if(!p) return "";
  var h="";
  if(p.sum) h+='<div class="aSum">'+esc(p.sum)+'</div>';
  if(p.lead) h+='<div class="aLead">'+esc(p.lead)+'</div>';
  if(p.body&&p.body.length){
    h+='<div class="coll"><div class="aPts">'+p.body.map(function(x,i){
      var m=/^(.{2,16}?)[：:]([\s\S]+)$/.exec(x);
      var inner=m?('<b>'+esc(m[1])+'：</b>'+esc(m[2])):esc(x);
      return '<div class="aPt"><span class="aNum">'+(i+1)+'</span><span class="aTxt">'+inner+'</span></div>';
    }).join("")+'</div></div><button type="button" class="cbtn">展开完整回答</button>';
  }
  if(p.tags&&p.tags.length){
    h+='<div class="aTags">'+p.tags.map(function(t){return '<span class="aTag">'+esc(t)+'</span>';}).join("")+'</div>';
  }
  return h;
}
/* ===== 立刻问 AI：提问后当场出答案（原先要等约 1 小时才出详解卡）===== */
function askAINow(item, q, ansId){

  function rich(html, cls){ box.className = "qaans rich" + (cls ? " " + cls : ""); box.style.display = ""; box.innerHTML = html; }
  if(!item){ say("问题没记上，请重试", "bad"); return; }
  var kp = item.kp || "未分类";
  var card = item.cardId ? getCard(item.cardId) : null;

    if(!parsed.sum) say("AI 正在提炼摘要…", "wait"); /* 摘要缺失时会给一次补调，先给个即时反馈 */

      var id = "det_" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);

      var tags = (p.tags && p.tags.length) ? p.tags : [kp];
      var det = { id:id, title:"你问：「" + q.slice(0,16) + (q.length > 16 ? "…" : "") + "」",
                  sum:p.sum, lead:p.lead, body:p.body, tags:tags, ch:ch,
                  date:todayStr(), date2:todayDate2(), read:false, isDetail:true, kp:kp, fromQids:[item.id] };
      var a = loadQA();
      for(var i=0;i<a.length;i++){

      }

      addFocus(kp, q, ch);

    });
  }).catch(function(err){

    say("没拿到答案：" + msg + "\n（先看网络是否正常，再点一次提问；若反复失败，把这句话截图发我）", "bad");

function genDetailFor(qs){

/* 【挡板】正在生成详解的提问 id —— 防止同一批提问被反复抓取、重复生成多张同标题详解卡。
   病根：checkAndGenDetails() 在「启动」和「每次切到问答页」都会跑，而 genDetailFor() 是异步的；
        AI 还没回来的这几秒里，那批提问仍是「待生成」→ 每次调用都再发一次请求、再存一张卡。
        实测：2 条待生成提问 + 来回切 3 次问答标签 = 一次生成 4 张一模一样的「你关注的「X」详解」。 */
function checkAndGenDetails(){
  var a=loadQA(),now=Date.now(),HOUR=3600000;
  var pending=a.filter(function(x){return qaState(x)==="pending" && (now-(x.ts||now))>=HOUR && !_genInflight[x.id];});
  if(!pending.length)return;
  var groups={};
  pending.forEach(function(x){var k=x.kp||"未分类";(groups[k]=groups[k]||[]).push(x);});
  Object.keys(groups).forEach(function(k){
    var qs=groups[k];
    qs.forEach(function(x){ _genInflight[x.id]=1; });   /* 先占位再发请求：下一次调用就不会再抓这批 */
    genDetailFor(qs);
  });
}

/* 待挖掘条目本身不自带日期 → 三级兜底算出「它大概哪天出现」：
   ① 条目自带 date；② 本地记的「第一次见到这条的日期」；③ 顺着 from 找到它延伸自的那张卡，用卡的日期 */
/* 顺着「来自 from」反推它延伸自的那张卡。返回 {card, cross}：
   cross=true 表示只能靠"跨频道"猜（可信度低，界面不当成确定来源展示） */
function digFromMatch(d){
  if(!d)return null;
  var from=String(d.from||"").replace(/^来自[:：]\s*/,"").replace(/^深挖[:：]\s*/,"").trim();
  if(!from)return null;
  var cards=CARDS||[];
  function pick(arr,test){for(var k=0;k<arr.length;k++){if(test(arr[k]))return arr[k];}return null;}
  var c=pick(cards,function(x){return String(x.id)===from;});
  if(c)return {card:c,cross:false};
  if(!/^\d+$/.test(from))return null;
  var num=String(from).replace(/^0+/,"")||"0";
  var sameCh=cards.filter(function(x){return normCh(x.ch)===normCh(d.ch);});
  c=pick(sameCh,function(x){return String(x.id).replace(/\D/g,"").replace(/^0+/,"")===num;})
    ||pick(sameCh,function(x){return String(x.id).endsWith(from);});
  if(c)return {card:c,cross:false};
  c=pick(cards,function(x){return String(x.id).replace(/\D/g,"").replace(/^0+/,"")===num;})
    ||pick(cards,function(x){return String(x.id).endsWith(from);});
  return c?{card:c,cross:true}:null;
}
function digSourceDate(d){
  if(!d)return "";

  var fs=loadDigFirst();

}
/* 来源行给人看的样子：认得出就显示源卡标题；认不出也绝不把内部代号（dt07 / 08）怼给用户 */
function digFromLabel(d){
  var m=digFromMatch(d);
  if(m&&m.card&&m.card.title&&!m.cross)return "来自："+m.card.title;
  var raw=String((d&&d.from)||"").trim();
  if(!raw)return "";
  if(/^(来自|深挖)[:：]/.test(raw))return raw;
  return "来自：更早的卡片";
}
/* 日期显示：统一成「今天 / 昨天 / 10月9日」，跟卡片别处的写法一致 */
function digDateLabel(iso){

  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(!m)return iso;

  var y=new Date(Date.now()-86400000);
  var yk=y.getFullYear()+'-'+('0'+(y.getMonth()+1)).slice(-2)+'-'+('0'+y.getDate()).slice(-2);
  if(iso===yk)return "昨天";
  return (+m[2])+"月"+(+m[3])+"日";
}

var JP_KANA=/[\u3040-\u309F\u30A0-\u30FF\u30FC]/;   /* 平假名 / 片假名 / 长音符：中文正文里不会出现 */
function jpLines(text){
  var t=String(text==null?"":text).replace(/\r/g,"");
  var raw=t.split(/[\n。！？!?；;／\/]+/);
  var out=[];
  for(var i=0;i<raw.length;i++){
    var s=raw[i].replace(/^[\s·•\-—:：]+/,"").replace(/[\s，,、]+$/,"").trim();
    if(s.length<2||s.length>100)continue;
    /* 「中文标签：日文原句」→ 只留冒号后的日文，中文标签不念 */
    var seg=s.split(/[:：]/);
    if(seg.length===2){
      var lf=seg[0].trim(), rt=seg[1].trim();
      if(lf&&rt&&!JP_KANA.test(lf)&&JP_KANA.test(rt))s=rt;
    }
    var kana=(s.match(/[\u3040-\u309F\u30A0-\u30FF\u30FC]/g)||[]).length;
    /* 至少 2 个假名、且假名占比 ≥ 20%：中文句子里偶尔混一个假名（如「は行」）不会被当日语念 */
    if(kana<2||kana/s.length<0.2)continue;
    if(out.indexOf(s)<0)out.push(s);
  }
  return out;
}

/* ====================== 长按：水波纹灌注 + 向右拖拽粉碎 ======================
   两个手势分开、互不干扰：
   · 按住不动（480ms）→ 弹出「打标签 / 移入待挖掘」面板（原逻辑，未改）
   · 按住并向右拖      → 进入粉碎模式：卡片跟着手指走、整片变红提示「松手粉碎」；
                        松手到门槛 → 弹确认框；没到门槛 → 弹回原位
   适用范围：所有知识卡（今日 / 学习频道 / 搜索 / 知识树）＋ 问答里的「问题」条目
             ＋ 待挖掘列表里的线索 ＋ 归档层里的问答条目 / 待挖掘条目 */
function cssEsc(s){return String(s).replace(/(")/g,'\\$1');}
var lpTimer=null,lpStart={x:0,y:0},lpId=null;
/* 可右滑粉碎的对象：知识卡 + 问答条目 + 待挖掘线索 + 归档层里的两类条目 */
var SW_SEL=".card[data-id],.cardrow[data-id],.qitem[data-qid],.dig[data-q],.aitem[data-aq],.aitem[data-qa]";
var SW_TH=78;                                  /* 松手粉碎的门槛（像素） */
var swEl=null,swStart={x:0,y:0},swOn=false,swArmed=false,swReady=false,swLeft=false,lastSwipeAt=0;
var crushPending=null;

function onSwStart(e){
  var t=e.touches[0];
  /* 「放回」是按钮、不是可粉碎的条目：从它上面起手不接管手势，避免误粉碎 */
  var sp=(e.target.closest("[data-restore]"))?null:e.target.closest(SW_SEL);
  swOn=false;swReady=false;swLeft=false;
  if(sp&&!flipBusy){swEl=sp;swArmed=true;swStart={x:t.clientX,y:t.clientY};resetCrush(sp);}
  else {swEl=null;swArmed=false;}
  var card=e.target.closest(".card[data-id]");
  if(!card){if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}return;}
  var lp=card.querySelector(".lp");if(!lp)return;
  var op=document.querySelector(".lp.show"); if(op&&op!==lp)closeLp(op);   /* 长按另一张卡：先把旧面板收掉 */
  lpId=lp.getAttribute("data-lp");lpStart={x:t.clientX,y:t.clientY};
  lpTimer=setTimeout(function(){showLp(lp,t);},480);
}
function onSwMove(e){
  var t=e.touches[0];
  if(swArmed&&swEl){
    var dx=t.clientX-swStart.x,dy=t.clientY-swStart.y;
    if(!swOn){
      if(Math.abs(dx)<=8&&Math.abs(dy)<=8)return;                 /* 还没动够：什么都不做 */
      if(dx>0&&Math.abs(dx)>Math.abs(dy)*1.15){
        swOn=true;swLeft=false;                                   /* 判定为「向右拖」→ 粉碎模式 */
        if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
        var lpx=swEl.querySelector(".lp.show"); if(lpx){_dropNav("lp");closeLp(lpx);}
      }else if(dx<0&&Math.abs(dx)>Math.abs(dy)*1.15&&flipOK(swEl)){
        swOn=true;swLeft=true;                                    /* 判定为「向左拖」→ 翻卡模式（翻过即已读） */
        if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
        var lpy=swEl.querySelector(".lp.show"); if(lpy){_dropNav("lp");closeLp(lpy);}
      }else{
        if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}           /* 竖向：放弃手势，保持原行为 */
        swArmed=false;swEl=null;return;
      }
    }
    if(swLeft){
      var dxl=Math.max(0,-dx);
      swReady=dxl>=FLIP_TH;                     /* 左滑门槛 */
      applyFlip(swEl,dxl,swReady);
      if(e.cancelable&&e.preventDefault)e.preventDefault();
      return;
    }
    var dxn=Math.max(0,dx);
    swReady=dxn>=SW_TH;                       /* 记住「够不够门槛」——松手时靠它决定弹框还是弹回 */
    applyCrush(swEl,dxn,swReady);
    if(e.cancelable&&e.preventDefault)e.preventDefault();
    return;
  }
  if(!lpTimer)return;
  if(Math.abs(t.clientX-lpStart.x)>10||Math.abs(t.clientY-lpStart.y)>10){clearTimeout(lpTimer);lpTimer=null;}
}
/* 手势要同时挂到主容器与「归档」全屏层——归档层不在主容器里面，只挂一处会收不到手势 */
[document.getElementById("wrap"),document.getElementById("arch")].forEach(function(root){
  if(!root)return;
  root.addEventListener("touchstart",onSwStart,{passive:true});
  root.addEventListener("touchmove",onSwMove,{passive:false});
  root.addEventListener("touchend",function(){endSwipe(true);},{passive:true});
  root.addEventListener("touchcancel",function(){endSwipe(false);},{passive:true});
});
function endSwipe(fire){
  if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
  if(!swOn||!swEl){swArmed=false;swEl=null;return;}
  var el=swEl,ready=swReady,left=swLeft;
  swArmed=false;swOn=false;swReady=false;swLeft=false;swEl=null;
  lastSwipeAt=Date.now();                 /* 记一笔：紧接着的那次 click 要吃掉，别顺手把卡片打开 */
  if(left){                               /* 左滑：够门槛 → 翻面盖「已读」章；不够 → 弹回 */
    if(ready&&fire)flipRead(el); else springBackFlip(el);
    return;
  }
  if(ready&&fire)askCrush(el); else springBack(el);
}
document.getElementById("wrap").addEventListener("touchend",function(){endSwipe(true);},{passive:true});
document.getElementById("wrap").addEventListener("touchcancel",function(){endSwipe(false);},{passive:true});

/* ---------- 粉碎过程的视觉：卡片跟手右移 + 整片变红提示 ---------- */
function childCrushFx(el){
  var k=el.children;
  for(var i=0;i<k.length;i++)if(k[i].classList&&k[i].classList.contains("crushfx"))return k[i];
  return null;
}
function ensureCrushFx(el){
  var fx=childCrushFx(el);
  if(!fx){
    fx=document.createElement("div");fx.className="crushfx";
    fx.innerHTML='<span class="cfi">'+ICON.crush+'</span><span class="cft">继续右拖</span>';
    el.appendChild(fx);
  }
  return fx;
}
function applyCrush(el,dx,ready){
  var fx=ensureCrushFx(el);
  el.classList.add("swipe");el.classList.remove("back");
  el.style.transform="translateX("+dx+"px)";
  fx.style.opacity=Math.min(1,dx/(SW_TH*0.6));
  fx.classList.toggle("rdy",!!ready);
  var lb=fx.querySelector(".cft");if(lb)lb.textContent=ready?"松手粉碎":"继续右拖";
}
function resetCrush(el){
  if(!el)return;
  el.classList.remove("swipe","back");
  if(!flipBusy)el.style.transform="";        /* 正在翻面动画中：别把它的 transform 抹掉 */
  var fx=childCrushFx(el);if(fx)fx.parentNode.removeChild(fx);
  var ff=childFlipFx(el);if(ff)ff.parentNode.removeChild(ff);
}
function springBack(el){
  if(!el)return;
  var fx=childCrushFx(el);
  el.classList.add("swipe","back");el.style.transform="translateX(0px)";
  if(fx){fx.style.opacity="0";fx.classList.remove("rdy");}
  setTimeout(function(){
    el.classList.remove("swipe","back");el.style.transform="";
    var f2=childCrushFx(el);if(f2)f2.parentNode.removeChild(f2);
  },320);
}

/* ---------- 向左拖拽：立体翻卡 = 已读（与「右滑粉碎」左右分工，互不打架） ---------- */
var FLIP_TH=62;              /* 左滑多少像素算「翻过去」（约一个指甲盖宽） */
var flipBusy=false;          /* 正在翻的这张卡，翻完前不接新动作，避免叠加动画 */
function childFlipFx(el){
  var k=el.children;
  for(var i=0;i<k.length;i++)if(k[i].classList&&k[i].classList.contains("flipfx"))return k[i];
  return null;
}
function ensureFlipFx(el){
  var fx=childFlipFx(el);
  if(!fx){
    fx=document.createElement("div");fx.className="flipfx";
    fx.innerHTML='<span class="ffi">'+ICON.check+'</span><span class="fft">继续左滑翻卡</span>';
    el.appendChild(fx);
  }
  return fx;
}
/* 只有「知识卡」能翻（问答条目没有已读这回事，往左滑不接管） */
function flipOK(el){
  return !!(el&&(el.classList.contains("card")||el.classList.contains("cardrow"))&&el.getAttribute("data-id"));
}
function applyFlip(el,dx,ready){
  var fx=ensureFlipFx(el);
  el.classList.add("swipe");el.classList.remove("back");
  var deg=Math.min(30,dx/7);                     /* 跟手侧倾一点，手感上「这张卡正被掀起来」 */
  el.style.transform="perspective(1000px) rotateY(-"+deg+"deg)";
  fx.style.opacity=Math.min(1,dx/(FLIP_TH*0.6));
  fx.classList.toggle("rdy",!!ready);
  var lb=fx.querySelector(".fft");if(lb)lb.textContent=ready?"松手标为已读":"继续左滑翻卡";
}
function springBackFlip(el){
  if(!el)return;
  var fx=childFlipFx(el);
  el.classList.add("swipe","back");
  el.style.transform="perspective(1000px) rotateY(0deg)";
  if(fx){fx.style.opacity="0";fx.classList.remove("rdy");}
  setTimeout(function(){
    if(!el)return;
    el.classList.remove("swipe","back");el.style.transform="";
    var f2=childFlipFx(el);if(f2)f2.parentNode.removeChild(f2);
  },320);
}
/* 立体翻卡动画（折纸式：折到侧棱 → 换面 → 展开，全程角度 ≤88°，不会有反字）
   ① 折 0→-88°（卡片只剩一条边）② 亮出背面章、展开 -88→0°（「已读」章正对用户）
   ③ 停一下 ④ 再折 0→-88°、换回正面 ⑤ 展开 -88→0°（正面已是已读：划线+变淡） */
function flipRead(el){
  if(flipBusy)return;
  var id=el?el.getAttribute("data-id"):null;if(!id)return;
  flipBusy=true;
  var FOLD=250,HOLD=560;
  var fx=childFlipFx(el);if(fx)fx.parentNode.removeChild(fx);
  el.classList.remove("swipe","back");
  var old=el.querySelector(".flipback");if(old&&old.parentNode)old.parentNode.removeChild(old);
  var back=document.createElement("div");back.className="flipback";
  back.innerHTML='<div class="fbIn"><span class="fbIc">'+ICON.check+'</span><b>已 读</b><span class="fbD">'+esc(todayDate2())+'</span></div>';
  el.appendChild(back);
  /* 正面内容 = 除背面章以外的全部子元素；换面时靠透明度切换（不依赖 backface-visibility） */
  var fronts=[];for(var i=0;i<el.children.length;i++){if(el.children[i]!==back)fronts.push(el.children[i]);}
  function frontsOp(v){for(var k=0;k<fronts.length;k++){fronts[k].style.opacity=v;}}
  el.classList.add("flipping");
  el.style.transition="none";
  el.style.transform="perspective(1000px) rotateY(0deg)";
  void el.offsetWidth;                            /* 强制回流：确保从 0° 出发 */
  var tilt=function(deg,ms,ease){el.style.transition="transform "+ms+"ms "+ease;el.style.transform="perspective(1000px) rotateY("+deg+"deg)";};
  tilt(-88,FOLD,"ease-in");                       /* ① 折到侧棱 */
  setTimeout(function(){
    frontsOp("0");back.style.opacity="1";         /* ② 侧棱处换面（此时卡片是零宽，看不出来） */
    tilt(0,FOLD,"ease-out");
    setTimeout(function(){                        /* ③ 停一下，让人看清「已读」章 */
      el.classList.add("done");                   /* 正面重新露出来之前，先让它带上已读外观 */
      var d=el.querySelector(".dot");if(d)d.classList.add("read");
      tilt(-88,FOLD,"ease-in");                   /* ④ 再折一次，换回正面 */
      setTimeout(function(){
        back.style.opacity="0";frontsOp("");      /* ⑤ 展开 → 正面，已是已读 */
        tilt(0,FOLD,"ease-out");
        setTimeout(function(){
          el.classList.remove("flipping");
          el.style.transition="";el.style.transform="";
          frontsOp("");back.style.opacity="";
          var b=el.querySelector(".flipback");if(b&&b.parentNode)b.parentNode.removeChild(b);
          flipBusy=false;
        },FOLD+50);
      },FOLD);
    },FOLD+HOLD);
  },FOLD);
  /* 记账：翻过即已读（重复翻同一张不会重复写） */
  var c=getCard(id);
  if(!c||!c.read){setRead(id,true);refreshRead();}
  toast("翻过即已读 ✓");
}

/* ---------- 粉碎确认框 ---------- */
var cdlg=document.getElementById("cdlg"),cdlgMask=document.getElementById("cdlgMask");

function crushTargetOf(el){
  /* 归档层里的问答条目（点整条看当初那版详解，往右滑就粉碎） */
  if(el.classList.contains("aitem")&&el.hasAttribute("data-qa")){
    var qid2=el.getAttribute("data-qa"),it2=null,a2=loadQA();
    for(var k=0;k<a2.length;k++)if(a2[k].id===qid2)it2=a2[k];
    var cid2=(it2&&it2.detailCardId)?it2.detailCardId:null;
    return {kind:"qa",qid:qid2,cardId:cid2,title:(it2?it2.q:"这条提问"),what:"这条提问",
      desc:cid2?"这条提问会从「归档 · 问答」里删掉，它生成的那张详解卡也会一并粉碎。":"这条提问会从「归档 · 问答」里删掉。"};
  }
  if(el.classList.contains("qitem")){
    var qid=el.getAttribute("data-qid"),it=null,a=loadQA();
    for(var i=0;i<a.length;i++)if(a[i].id===qid)it=a[i];
    var cid=(it&&it.detailCardId)?it.detailCardId:null;
    return {kind:"qa",qid:qid,cardId:cid,title:(it?it.q:"这条提问"),what:"这条提问",
      desc:cid?"这条提问会从「问答」里删掉，它生成的那张详解卡也会一并粉碎。":"这条提问会从「问答」里删掉。"};
  }
  /* 待挖掘线索（主列表里的 .dig / 归档里的待挖掘条目） */
  if(el.classList.contains("dig")||(el.classList.contains("aitem")&&el.hasAttribute("data-aq"))){
    var q=el.getAttribute("data-q")||el.getAttribute("data-aq");
    return {kind:"dig",q:q,title:q,what:"这条线索",
      desc:"这条线索会从「待挖掘」和归档里彻底消失，本机不会再出现。已如实告知：换设备 / 清缓存后，云端推送可能再下来。"};
  }
  var id=el.getAttribute("data-id"),c=getCard(id);
  return {kind:"card",id:id,title:(c&&c.title)||"这张卡",what:"这张卡",
    desc:"它会从今日、学习频道、搜索、知识树里一起消失，刷新也不会再回来。"};
}

function doCrush(){
  var p=crushPending;if(!p)return;
  crushPending=null;                       /* 先清空：关闭时不再触发弹回动画 */
  if(p.t.kind==="qa")crushQA(p.t.qid,p.t.cardId);
  else if(p.t.kind==="dig")crushDig(p.t.q);

/* ---------- 粉碎（本机删除）----------
   App 是静态 PWA、写不回 feed.json：粉碎 = 在本机记一条「已粉碎」黑名单，
   所有列表装载时把它滤掉。本机刷新不复活；但换设备 / 清缓存后，云端推送还会再下来。 */
function crushCardById(id){
  if(!id)return;
  var s=loadLocal();s.deleted=s.deleted||{};s.deleted[id]=true;
  if(s.read)delete s.read[id];
  if(s.star)delete s.star[id];
  if(s.tags)delete s.tags[id];
  saveLocal(s);
  /* 本地生成的详解卡：从 kb_details 里彻底移除 */
  var ds=loadDetails();
  if(ds[id]){delete ds[id];try{localStorage.setItem(LS_DET,JSON.stringify(ds));}catch(e){}}
  /* 它是某条问答的答案：那条问题退回「待生成」，可以重新问。
     ⚠ 但**已归档（已读 / 已忽略）的一律不动**——归档的意思是"我看完了、收起来了"，
       不该被一次粉碎打回列表。否则你清理重复的详解卡时，归档的问答会集体"复活"
       并在一小时后重新生成新详解卡（就是用户反馈的"归档失败、推送混乱"）。
       只把失效的详解链接摘掉即可，归档层会退回展示当时那份原文。 */
  var qa=loadQA(),hit=false;
  for(var i=0;i<qa.length;i++){
    if(qa[i].detailCardId===id){
      qa[i].detailCardId=null;
      var _qs=qaState(qa[i]);
      if(_qs!=="read"&&_qs!=="ignored"){qa[i].state="pending";qa[i].a="";}
      hit=true;
    }
  }
  if(hit)saveQA(qa);
  CARDS=CARDS.filter(function(c){return c.id!==id;});
}
function crushQA(qid,cardId){
  /* 记一条「已粉碎」黑名单：问答列表是「本地 + 云端备份」两份合起来的，
     只从 kb_qa 里删掉的话，下次拉云端备份又会把它补回来（复活）。
     所以这里像卡片/待挖掘那样记黑名单，读取时统一滤掉。 */
  if(qid){var d=loadQaDel();if(d.indexOf(qid)<0){d.push(qid);saveQaDel(d);}}
  saveQA(loadQA().filter(function(x){return x.id!==qid;}));
  if(cardId)crushCardById(cardId);
}
/* 待挖掘线索的粉碎 = 本机永久抹掉：记一条黑名单 + 从内存数组摘掉 + 清掉它的「已看」记录。
   能力边界（已如实告知用户）：App 是静态站点、写不回 feed.json，
   所以换设备 / 清缓存后，云端推送还会把这条线索再推下来。 */
var LS_DIGDEL="kb_digdel";
function loadDigDel(){try{return JSON.parse(localStorage.getItem(LS_DIGDEL)||"[]")||[];}catch(e){return [];}}
function saveDigDel(a){try{localStorage.setItem(LS_DIGDEL,JSON.stringify(a));}catch(e){}}
function crushDig(q){
  if(!q)return;
  var a=loadDigDel();if(a.indexOf(q)<0){a.push(q);saveDigDel(a);}
  var r=loadDigRead(),i=r.indexOf(q);if(i>=0){r.splice(i,1);saveDigRead(r);}
  var out=[];for(var k=0;k<DIG.length;k++){if(DIG[k].q!==q)out.push(DIG[k]);}
  DIG=out;
}
function afterCrush(crushedId){
  /* 若正开着被粉碎的那张卡的摘要页，一并关掉，避免读到已删内容 */
  if(crushedId&&readTarget===crushedId&&reader.classList.contains("on")){
    var i=navStack.lastIndexOf("reader");if(i>=0)navStack.splice(i,1);
    readTarget=null;closeReader();
  }
  renderToday();
  if(curView==="channels"){
    if(chanDrill)renderChanList(curChan);else renderChannels();
    if(chanSearch&&chanSearch.value.trim())doSearch(chanSearch.value.trim());
  }else renderChannels();
  renderTree();renderDig();updateQaBdg();
  if(curView==="qa")renderQA();
  if(archEl&&archEl.classList.contains("on")&&typeof renderArch==="function")renderArch();
}

function showLp(lp,t){
  pushNav("lp"); _ensureGuard();     /* `.35`：长按面板也占一条真实历史条目（真机上"用返回收起它"才不吃掉上层） */
  var rect=lp.getBoundingClientRect();
  var ox=(t.clientX-rect.left),oy=(t.clientY-rect.top);
  lp.style.setProperty("--ox",ox+"px");lp.style.setProperty("--oy",oy+"px");
  lp.classList.add("show","go");
  // 水波纹
  var rip=document.createElement("div");rip.className="ripple";
  var maxr=Math.hypot(Math.max(ox,rect.width-ox),Math.max(oy,rect.height-oy))*2.2;
  rip.style.left=ox+"px";rip.style.top=oy+"px";rip.style.width=maxr+"px";rip.style.height=maxr+"px";
  lp.appendChild(rip);
  rip.animate([{transform:"translate(-50%,-50%) scale(0)",opacity:.9},{transform:"translate(-50%,-50%) scale(1)",opacity:.5}],{duration:420,easing:"cubic-bezier(.22,1,.36,1)"});
  buildTagPicker(lp);
}

function buildTagPicker(lp){
  var tp=lp.querySelector(".tagpick");if(tp.dataset.built)return;tp.dataset.built="1";
  var sug=["重点","易混","面试常考","北数所相关","需复习","已掌握"];
  var card=getCard(lp.getAttribute("data-lp"));
  var html=sug.map(function(s){var on=card&&card.tags&&card.tags.indexOf(s)>=0;return '<span data-tag="'+esc(s)+'" class="'+(on?"on":"")+'">'+esc(s)+'</span>';}).join("");
  html+='<input placeholder="自定义标签，回车添加">';
  tp.innerHTML=html;
  tp.querySelectorAll("[data-tag]").forEach(function(s){
    s.addEventListener("click",function(){
      var tag=s.getAttribute("data-tag");var id=lp.getAttribute("data-lp");var c=getCard(id);
      c.tags=c.tags||[];if(c.tags.indexOf(tag)>=0){c.tags.splice(c.tags.indexOf(tag),1);s.classList.remove("on");}
      else{c.tags.push(tag);s.classList.add("on");}
      setTags(id,c.tags);   // 持久化
      toast("标签："+tag);
    });
  });
  var inp=tp.querySelector("input");
  inp.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&inp.value.trim()){var id=lp.getAttribute("data-lp");var c=getCard(id);c.tags=c.tags||[];c.tags.push(inp.value.trim());setTags(id,c.tags);toast("已加标签："+inp.value.trim());inp.value="";}});
}
function addDig(id){

  renderDig();
}

/* ====================== 拉取每日推送（feed.json） ======================
   启动后去仓库根目录拉 feed.json：拉到就用远程内容（每日推送会更新它），
   拉不到（首次/离线）就保留下面内置的兜底内容，绝不白屏。
   feed.json 不在 service worker 缓存清单里，每次都走网络，保证刷得出新内容。 */
function loadFeed(onDone){
  fetch('feed.json?v='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('feed 404');return r.json();})
    .then(function(d){
      if(d&&Array.isArray(d.cards)&&d.cards.length){CARDS=d.cards;}
      mergeDetailsIntoCards(); /* 回填本地生成的详解卡（feed 覆盖 CARDS 后不丢） */
      if(d&&Array.isArray(d.dig)&&d.dig.length){DIG=d.dig;}
      // 用本地持久化回填所有用户操作（已读/标星/标签/待挖掘），刷新/重开不丢
      var s=loadLocal();
      CARDS.forEach(function(c){
        if(s.read&&s.read[c.id])c.read=true;
        if(s.star&&s.star[c.id])c.star=true;
        if(s.tags&&s.tags[c.id])c.tags=s.tags[c.id];
      });
      /* 本机粉碎过的卡片：所有列表一律不再出现（喂下来的 feed 也照样滤掉） */
      if(s.deleted){var _dl=s.deleted;CARDS=CARDS.filter(function(c){return !_dl[c.id];});}
      backfillAnswers();
      loadCloudKB();
      if(s.dig&&s.dig.length)s.dig.forEach(function(dg){if(!DIG.some(function(x){return x.q===dg.q;}))DIG.unshift(dg);});
      renderToday();renderChannels();renderDig();updateQaBdg();_archBtn("qaArchBtn",archCount("qa"));
      if(!CARDS.some(function(c){return normCh(c.ch)===treeCh;}))initTreeCh();
      renderTreePills();renderTree();if(document.getElementById("segMap").classList.contains("on"))renderShuli();
    })
    .catch(function(e){/* 离线或首次部署：用内置兜底，不报错 */})
    .then(function(){ if(onDone)onDone(); });
}
loadFeed();

/* ====================== 下拉刷新 / 手动刷新 ====================== */
(function(){
  var ptr=document.getElementById('ptr');
  var ptrTx=ptr.querySelector('.ptr-tx');
  var ptrIc=ptr.querySelector('.ptr-ic');
  var MAXP=72, THRESH=52;
  var startY=0, pull=0, active=false, busy=false;
  function todayActive(){var v=document.querySelector('.view[data-view="today"]');return v&&v.classList.contains('active');}
  function reset(){ptr.style.transition='height .22s cubic-bezier(.22,1,.36,1)';ptr.style.height='0px';ptr.classList.remove('go');ptrIc.classList.remove('spin');ptrTx.textContent='下拉刷新';}
  function doRefresh(){
    if(busy)return; busy=true;
    ptr.style.transition='height .2s'; ptr.style.height=THRESH+'px'; ptr.classList.add('go');
    ptrTx.textContent='刷新中…'; ptrIc.classList.add('spin');
    loadFeed(function(){ busy=false; reset(); if(typeof toast==='function')toast('已拉取最新推送'); });
  }
  var rb=document.getElementById('refreshBtn'); if(rb) rb.addEventListener('click', doRefresh);
  document.addEventListener('touchstart', function(e){
    if(busy||!todayActive()||window.scrollY>0) return;
    if(e.target&&e.target.closest&&e.target.closest('.card,.reader,.sheet,.tab,button')) return;
    startY=e.touches[0].clientY; pull=0; active=true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!active||busy) return;
    var dy=e.touches[0].clientY-startY;
    if(dy<=0||window.scrollY>0){ active=false; return; }
    e.preventDefault();
    pull=Math.min(dy*0.5, MAXP);
    ptr.style.transition='none';
    ptr.style.height=pull+'px';
    var over=pull>=THRESH;
    ptr.classList.toggle('go', over);
    ptrTx.textContent= over?'松开刷新':'下拉刷新';
  }, {passive:false});
  document.addEventListener('touchend', function(){
    if(!active) return; active=false;
    if(pull>=THRESH) doRefresh(); else reset();
  });
})();

</script>
<script>
/* ====================== 自动更新：确保装进桌面的 PWA 不再卡在旧版本 ======================
   背景：sw.js 曾被 CDN 缓存 600 秒、旧 SW 又缓存了旧 index.html，
   导致「代码已部署、但用户打开的还是旧页面」。这里三重保险根治：
   1) updateViaCache:'none'    → 每次联网都去拿最新 sw.js，绕过 CDN 的 600 秒缓存；
   2) 监听 SW_UPDATED 消息     → 新 SW 一接管，立即拉最新 index.html 并原地刷新；
   3) 每 30 分钟 + 回到前台时   → 主动 reg.update() + 比对线上版本号，发现新版自动刷新。 */
var _APP_VER_ = '2026-10-11.39';
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(function(reg){
      // 每次进入都检查一次 SW 更新
      try{reg.update();}catch(e){}
      // 有新的 SW 装好待接管 → 让它立刻接管，随后触发自动刷新
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing; if(!nw)return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            // 新 SW 已就绪，发消息请它接管（skipWaiting 已在 SW 内做）
            try{nw.postMessage({type:'SKIP_WAITING'});}catch(e){}
          }
        });
      });
    }).catch(function(e){console.warn('SW注册失败',e);});
  });
  /* ===== 发现新版后「挑空档」再刷新（关键：绝不打断正在看的卡片）=====
     教训：原先一发现新版就 location.reload()，你正开着卡片看时会被当场刷掉、
     弹回列表页。现在改成「待生效」：记下有待更新，等你退回列表（没有任何覆盖层）
     的那一刻再刷新；等待期间一切照常可用，只是把刷新挪到安全的空档。 */
  var _reloaded=false,_pendingReload=false;
  function _busyReading(){
    try{
      return reader.classList.contains("on") || sheet.classList.contains("on")
          || (archEl&&archEl.classList.contains("on")) || (cdlg&&cdlg.classList.contains("on"))
          || (jpRead&&jpRead.classList.contains("on")) || (askFab&&askFab.classList.contains("on"))
          || (srSheet&&srSheet.classList.contains("on"))
          || (curView==="channels"&&chanDrill)
          || (curView==="tree"&&treeMode==="shuli"&&shuliDrill);
    }catch(e){ return false; }
  }
  function _applyUpdate(){
    if(_reloaded) return;
    if(_busyReading()){ _pendingReload=true; return; }   /* 你正在看东西 → 先不打断，等空档 */
    _reloaded=true; location.reload(true);
  }
  function _flushPendingReload(){
    if(_pendingReload&&!_reloaded&&!_busyReading()){ _reloaded=true; location.reload(true); }
  }
  // 每 1.5 秒探一次空档：你一旦退回列表，就立刻把待生效的刷新补上
  setInterval(_flushPendingReload,1500);
  // 新 SW 接管 → 挑空档刷新到最新
  navigator.serviceWorker.addEventListener('message',function(ev){
    if(ev.data&&ev.data.type==='SW_UPDATED') _applyUpdate();
  });
  // 控制器切换（新 SW 接管）也兜底刷新一次
  navigator.serviceWorker.addEventListener('controllerchange',function(){ _applyUpdate(); });
  // 定时 + 回前台：主动比对线上版本号，发现新版自动刷新
  function _checkVer(){
    fetch('version.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
      if(d&&d.v&&d.v!==_APP_VER_) _applyUpdate();
    }).catch(function(){});
  }
  setInterval(_checkVer,30*60*1000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')_checkVer();});
  window.addEventListener('load',function(){setTimeout(_checkVer,1500);});
}
</script>
