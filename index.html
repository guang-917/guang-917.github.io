<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="知识工作台">
<title>知识工作台</title>
<style>
:root{
  --bg:#f4f1ea; --bg-2:#ece7dd; --card:#ffffff; --card-2:#fbf9f5;
  --ink:#232019; --ink-2:#5d564a; --ink-3:#9b9184; --line:#e6dfd2; --line-2:#efe9dd;
  --ai:#5b5bd6; --ai-soft:#ececfa;
  --data:#0f8f7d; --data-soft:#e2f3ef;
  --jp:#e8604c; --jp-soft:#fbeae7;
  --gold:#c9a227; --gold-soft:#f5ecd4;
  --shadow:0 1px 2px rgba(35,32,25,.05), 0 8px 24px -12px rgba(35,32,25,.16);
  --shadow-sm:0 1px 2px rgba(35,32,25,.05);
  --r:16px; --r-sm:10px;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,serif;
  --spring:cubic-bezier(.34,1.4,.44,1);
  --glide:cubic-bezier(.22,1,.36,1);
  /* 展开/收回专用：比 --glide 平缓。
     --glide 前倾太狠（120ms 就走完 84% 行程），前几帧一帧要跳 17% 的位移，
     手机上只要有掉帧就会看着「咯噔」；这条把每帧最大位移压到 9% 左右，走得更匀。 */
  --flip:cubic-bezier(.38,.6,.26,1);
  --tabh:58px;
  /* 提问悬浮球：亮色=白球深图标 */
  --fab-bg:#ffffff; --fab-fg:#232019; --fab-line:#e6dfd2;
  --fab-shadow:0 8px 22px -6px rgba(0,0,0,.3);
}
html[data-theme="dark"]{
  --bg:#12141a; --bg-2:#0d0f14; --card:#1a1d26; --card-2:#20242e;
  --ink:#e9e6e0; --ink-2:#a8a396; --ink-3:#6e6a60; --line:#2a2f3a; --line-2:#232833;
  --ai:#8f8ff0; --ai-soft:#232440;
  --data:#43c0ab; --data-soft:#1a3330;
  --jp:#f0796a; --jp-soft:#38231f;
  --gold:#d8b447; --gold-soft:#2e2817;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  /* 提问悬浮球：暗色=深球亮图标，与背景同调但浮起一档 */
  --fab-bg:#262b38; --fab-fg:#e9e6e0; --fab-line:#3a4152;
  --fab-shadow:0 10px 26px -8px rgba(0,0,0,.8);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.7; letter-spacing:.01em;
  max-width:520px; margin:0 auto; overflow-x:hidden;
  transition:background .28s ease,color .28s ease;
  -webkit-font-smoothing:antialiased; -webkit-touch-callout:none;
}
.wrap{padding:0 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom))}

/* ---------- 页头 ---------- */
.hdr{
  position:sticky; top:0; z-index:40;
  backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom:1px solid transparent; transition:border-color .25s, background .28s;
}
.hdr.scrolled{border-bottom:1px solid var(--line-2)}
.hdr-in{max-width:520px;margin:0 auto;padding:13px 16px 9px;display:flex;align-items:center;gap:10px}
.hdr .bk{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);display:none;align-items:center;justify-content:center;flex:none;cursor:pointer;
  transition:transform .18s var(--spring); font-size:20px; line-height:1;
}
.hdr .bk:active{transform:scale(.86)}
.hdr.has-bk .bk{display:flex}
.hdr .tt{flex:1;min-width:0}
.hdr .tt b{font-family:var(--serif);font-size:17px;font-weight:600;display:block;line-height:1.3}
.hdr .tt span{font-size:11.5px;color:var(--ink-3);letter-spacing:.05em;display:block;margin-top:2px}
.tbtn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--card); color:var(--ink-2); font-size:15px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  transition:transform .18s var(--spring);
}
.tbtn:active{transform:scale(.86)}

/* ---------- Tab ---------- */
.view{display:none; animation:fade .32s var(--glide)}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 进度条 */
.pbar{max-width:520px;margin:0 auto;padding:2px 16px 12px}
.pbar .pt{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink-3);margin-bottom:7px}
.pbar .pt b{color:var(--ink);font-weight:600;font-size:13px}
.track{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--data),var(--ai));transition:width .6s var(--glide)}

/* ---------- 卡片 ---------- */
.card{
  position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 16px; margin-bottom:13px; box-shadow:var(--shadow); overflow:hidden;
  transition:transform .15s var(--spring), box-shadow .15s ease, border-color .2s;
  cursor:pointer;
}
.card:active{transform:scale(.98); box-shadow:var(--shadow-sm); border-color:var(--line-2)}
.card .row{display:flex;align-items:flex-start;gap:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--jp);margin-top:9px;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--jp) 22%,transparent)}
.dot.read{background:var(--line);box-shadow:none}
.chip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;flex:none}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.chip.data{background:var(--data-soft);color:var(--data)}
.chip.jp{background:var(--jp-soft);color:var(--jp)}
.card h3{font-size:15.5px;font-weight:600;line-height:1.4;flex:1;min-width:0}
.card .sum{font-size:13px;color:var(--ink-2);margin-top:7px;line-height:1.6}
.card .meta{font-size:11.5px;color:var(--ink-3);margin-top:10px;display:flex;gap:10px;align-items:center}
.card .star{margin-left:auto;font-size:14px;color:var(--ink-3)}
.card .star.on{color:var(--gold)}
/* 已读卡片：标题划线 + 整体变淡（日期/星标仍可见，与「最外层三样」保持一致） */
.card.done{opacity:.6}
.card.done h3{text-decoration:line-through;text-decoration-color:var(--ink-3);text-decoration-thickness:1px}
.filter{margin-left:auto;font-size:12px;color:var(--ink-3);background:var(--card-2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;transition:all .15s}
.filter.on{background:var(--ai);color:#fff;border-color:var(--ai)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:11px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
/* 最外层关键词：只占一行，按实际宽度自动决定放几个（不写死数量），放不下的收成「+N」；完整关键词在摘要页 */
.tags.one{flex-wrap:nowrap;overflow:hidden}
.tags.one span{flex:0 0 auto;white-space:nowrap;max-width:100%}
.tags .tmore{color:var(--ink-3);background:transparent;border:1px dashed var(--line)}

/* ---------- 向右拖拽粉碎 ---------- */
.card.swipe,.cardrow.swipe,.qitem.swipe,.dig.swipe,.aitem.swipe{transition:none}
.card.swipe.back,.cardrow.swipe.back,.qitem.swipe.back,.dig.swipe.back,.aitem.swipe.back{transition:transform .3s var(--spring)}
.crushfx{position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(112deg,#d8483e,#b0261c);color:#fff;font-size:13.5px;font-weight:600;letter-spacing:.05em;
  opacity:0;pointer-events:none;z-index:6}
.crushfx svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.crushfx.rdy{animation:crushPulse .46s ease-in-out infinite alternate}
@keyframes crushPulse{from{filter:brightness(1)}to{filter:brightness(1.22)}}

/* ---------- 向左拖拽：立体翻卡 = 已读（往右仍是粉碎，左右分工） ---------- */
.flipfx{position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(112deg,#2f9e78,#1c7a57);color:#fff;font-size:13.5px;font-weight:600;letter-spacing:.05em;
  opacity:0;pointer-events:none;z-index:6}
.flipfx svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.flipfx.rdy{animation:flipPulse .46s ease-in-out infinite alternate}
@keyframes flipPulse{from{filter:brightness(1)}to{filter:brightness(1.18)}}
/* 翻卡进行中：把这张卡抬到邻卡之上，翻折时不会被压住 */
.card.flipping,.cardrow.flipping{z-index:3}
/* 背面：一张平铺在卡片上的「已读」章（默认透明，翻折到侧棱时才亮出来）
   注意：翻折角度全程不超过 90°，所以永远不可能出现「反字」——
   一开始用「整圈 360° + backface-visibility」的写法，静止时是对的，
   但 Chrome 在动画过程中会把该层按平面栅格化，正面文字被翻成镜像露出来，故改成这套折纸式。 */
.flipback{position:absolute;inset:0;border-radius:inherit;background:var(--card);
  border:1px solid color-mix(in srgb,var(--data) 42%,var(--line));
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  opacity:0;transition:opacity .1s linear}
.flipback .fbIn{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--data);
  border:2px solid color-mix(in srgb,var(--data) 58%,transparent);border-radius:12px;padding:9px 20px;
  transform:rotate(-5deg);opacity:.94}
.flipback .fbIc{display:flex}
.flipback .fbIc svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.flipback .fbIn b{font-size:15px;letter-spacing:.3em;font-weight:700;text-indent:.3em}
.flipback .fbD{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
/* 知识树里的行也沿用「已读＝划线变淡」，跟卡片保持一致 */
.cardrow.done{opacity:.6}
.cardrow.done .ct b{text-decoration:line-through;text-decoration-color:var(--ink-3);text-decoration-thickness:1px}

/* ---------- 粉碎确认框 ---------- */
.cdlg-mask{position:fixed;inset:0;background:rgba(20,18,14,.42);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.cdlg-mask.on{opacity:1;pointer-events:auto}
.cdlg{position:fixed;left:50%;top:50%;width:min(330px,86vw);z-index:71;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:20px 18px 16px;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transform:translate(-50%,-46%) scale(.94);transition:opacity .25s,transform .3s var(--spring)}
.cdlg.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.cdlg .cdic{width:46px;height:46px;border-radius:15px;background:color-mix(in srgb,#c0392b 12%,var(--card));color:#c0392b;
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.cdlg .cdic svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cdlg .cdt{font-size:16px;font-weight:700;text-align:center;color:var(--ink)}
.cdlg .cdq{font-size:13.5px;color:var(--ink-2);text-align:center;margin-top:8px;line-height:1.6;word-break:break-word}
.cdlg .cdn{font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.7;background:var(--card-2);border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;margin-top:11px}
.cdlg .cdb{display:flex;gap:10px;margin-top:16px}
.cdlg .cdb button{flex:1;border-radius:12px;padding:12px 0;font-size:14px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink-2)}
.cdlg .cdb button.ok{background:#c0392b;border-color:#c0392b;color:#fff}
.cdlg .cdb button:active{transform:scale(.97)}

/* ---------- 频道门户 ---------- */
.chan{display:flex;align-items:center;gap:14px;padding:18px 16px}
.chan .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.chan .ic.ai{background:var(--ai-soft);color:var(--ai)}
.chan .ic.data{background:var(--data-soft);color:var(--data)}
.chan .ic.jp{background:var(--jp-soft);color:var(--jp)}
.chan .ct{flex:1;min-width:0}
.chan .ct b{font-size:15.5px;font-weight:600;display:block}
.chan .ct span{font-size:12px;color:var(--ink-3)}
.chan .ar{color:var(--ink-3);font-size:18px}

/* ---------- 知识树 ---------- */
.seg{max-width:520px;margin:6px auto 4px;padding:0 16px;display:flex;gap:8px}
.seg button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:13px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tree{margin-bottom:14px}
.tree .th{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 0}
.tree .th .nm{font-family:var(--serif);font-size:15px;font-weight:600}
.tree .th .cnt{font-size:12px;color:var(--ink-3);margin-left:auto}
.tree .th .tg{transition:transform .3s var(--glide)}
.tree.open .th .tg{transform:rotate(90deg)}
.tree .body{max-height:0;overflow:hidden;transition:max-height .4s var(--glide)}
.tree.open .body{max-height:900px}
.node{display:flex;align-items:center;gap:10px;padding:9px 0 9px 6px;border-left:2px solid var(--line-2);margin-left:6px;padding-left:14px;position:relative}
.node::before{content:"";position:absolute;left:-2px;top:50%;width:12px;height:2px;background:var(--line-2)}
.node .nd{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid var(--ink-3)}
.node.done .nd{background:var(--data);border-color:var(--data);box-shadow:0 0 0 4px color-mix(in srgb,var(--data) 16%,transparent)}
.node.new .nd{background:var(--ai);border-color:var(--ai);animation:breathe 2.2s ease-in-out infinite}
.node.need .nd{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent)}
.node .lab{font-size:14px;flex:1}
.node.todo .lab{color:var(--ink-3)}
@keyframes breathe{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--ai) 12%,transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--ai) 3%,transparent)}}
/* ============ 梳理视图（从卡片里提炼的「图」· 列表说卡、梳理说图） ============ */
.sh-stat{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin:2px 2px 4px;line-height:1.7}
.sh-stat b{color:var(--ink)}
.sh-stat .sh-busy{color:var(--data);font-weight:700}
.sh-stat .sh-redo{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:11px;border-radius:8px;padding:3px 9px;cursor:pointer;font-family:inherit}
.sh-stat .sh-redo:active{transform:scale(.95)}
.sh-sec{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin:15px 2px 9px}
.sh-sec .shk{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--data-soft);color:var(--data)}
.sh-sec .shk.k2{background:var(--gold-soft);color:var(--gold)}
/* 图卡（流程图 / 思维导图 / 对比表的公共壳） */
.sh-graph{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:13px 13px 11px;margin-bottom:12px;cursor:pointer;transition:transform .15s var(--spring)}
.sh-graph:active{transform:scale(.985)}
.shgt{font-size:14px;font-weight:700;line-height:1.5;margin-bottom:10px}
.shgt .shgk{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-3);margin-left:6px;vertical-align:2px;white-space:nowrap}
.sh-tap{font-size:11px;color:var(--ink-3);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
/* 流程图 */
.sh-step{display:flex;gap:10px;align-items:flex-start}
.sh-step .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--data-soft);color:var(--data);font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.sh-step .mid{flex:1;min-width:0}
.sh-step .tt{font-size:13px;font-weight:700;line-height:1.5}
.sh-step .dd{font-size:11.5px;color:var(--ink-2);line-height:1.55;margin-top:2px}
.sh-fa{width:2px;height:11px;background:var(--line);margin:3px 0 3px 10px}
.sh-note{font-size:11px;color:var(--ink-3);margin-top:9px;line-height:1.6}
/* 思维导图 */
.sh-mroot{display:inline-block;font-size:12.5px;font-weight:800;color:var(--data);background:var(--data-soft);border:1.5px solid var(--data);border-radius:10px;padding:7px 12px;margin:2px 0 11px}
.sh-mbr{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.sh-mbr:last-child{margin-bottom:2px}
.sh-mbr .bl{flex:none;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;min-width:52px;text-align:center}
.sh-mbr .chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:3px;min-width:0}
.sh-chip{font-size:11px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;line-height:1.4}
/* 对比表 */
.sh-cmp{border:1px solid var(--line-2);border-radius:11px;overflow:hidden}
.sh-cmp .row{display:grid;grid-template-columns:60px 1fr 1fr}
.sh-cmp .row+.row{border-top:1px solid var(--line-2)}
.sh-cmp .c{padding:9px 8px;font-size:11.5px;line-height:1.55;color:var(--ink-2);min-width:0;word-break:break-word}
.sh-cmp .c+.c{border-left:1px solid var(--line-2)}
.sh-cmp .lb{color:var(--ink-3);font-weight:700;font-size:11px;background:var(--card-2)}
.sh-cmp .hd .c{font-weight:800;font-size:12px;color:var(--ink)}
.sh-cmp .hd .c2{color:var(--data)}
.sh-cmp .hd .c3{color:var(--jp)}
/* 主题门牌（两行式：说图不说卡） */
.sh-trow{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);padding:9px 12px 10px;margin-bottom:8px;cursor:pointer;transition:transform .15s var(--spring)}
.sh-trow:active{transform:scale(.985)}
.sh-trow .top{display:flex;align-items:center;gap:8px}
.sh-trow .nm{font-size:13px;font-weight:700;flex:1;min-width:0}
.sh-trow .cnt{font-size:10.5px;color:var(--ink-3);flex:none}
.sh-trow .ar{color:var(--ink-3);font-size:12px;flex:none}
.sh-trow .figs{font-size:11px;color:var(--ink-2);margin-top:3px;line-height:1.55}
.sh-trow.gap{border-style:dashed;background:var(--card-2);box-shadow:none}
.sh-trow.gap .nm{color:var(--ink-3);font-weight:600}
.sh-trow.gap .figs{color:var(--ink-3)}
/* 面包屑 / 「翻回卡」的桥 */
.sh-crumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);margin:2px 2px 12px;flex-wrap:wrap}
.sh-crumb .bk{color:var(--data);font-weight:700;cursor:pointer;padding:2px 6px;margin:-2px 0 -2px -6px;border-radius:7px}
.sh-crumb .bk:active{background:var(--data-soft)}
.sh-crumb b{color:var(--ink);font-size:12.5px;margin-left:2px}
.sh-bridge{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:14px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .15s var(--spring)}
.sh-bridge span{font-size:11px;color:var(--ink-3);flex:none}
.sh-bridge b{font-size:12.5px;flex:1;min-width:0;font-weight:600}
.sh-bridge .ar{color:var(--ink-3)}
.sh-bridge:active{transform:scale(.985)}
/* 加载 / 空 / 失败 */
.sh-load{text-align:center;padding:44px 18px;color:var(--ink-2);font-size:12.5px;line-height:2}
.sh-load .ld{display:flex;gap:5px;justify-content:center;margin-bottom:10px}
.sh-load .ld i{width:7px;height:7px;border-radius:50%;background:var(--data);opacity:.25;animation:shp 1.2s infinite}
.sh-load .ld i:nth-child(2){animation-delay:.2s}
.sh-load .ld i:nth-child(3){animation-delay:.4s}
@keyframes shp{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.sh-empty{text-align:center;padding:36px 18px;color:var(--ink-3);font-size:12.5px;line-height:1.95}
.sh-empty button{margin-top:13px;border:1px solid var(--data);color:var(--data);background:var(--card);border-radius:10px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
/* 深读弹层 */
.sr-mask{position:fixed;inset:0;background:rgba(20,18,14,.32);z-index:57;opacity:0;pointer-events:none;transition:opacity .3s}
.sr-mask.on{opacity:1;pointer-events:auto}
.sr{position:fixed;bottom:0;width:100%;max-width:520px;left:50%;transform:translate(-50%,100%);z-index:58;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px -12px rgba(0,0,0,.4);padding:8px 18px calc(24px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .42s var(--spring)}
.sr.on{transform:translate(-50%,0)}
.sr .grip{width:38px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 14px}
.sr .sh{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:4px;line-height:1.55}
.sr .shtag{font-size:11.5px;color:var(--data);margin-bottom:12px}
.sr p{font-size:14px;color:var(--ink-2);line-height:1.85;margin-bottom:10px}
.sr .from{font-size:11px;color:var(--ink-3);margin:14px 0 8px}
.sr .backcard{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--card-2);transition:transform .15s var(--spring)}
.sr .backcard span{font-size:10.5px;color:var(--ink-3);flex:none}
.sr .backcard b{font-size:12.5px;flex:1;min-width:0;font-weight:600;line-height:1.45}
.sr .backcard .go{font-size:11px;color:var(--data);font-weight:700}
.sr .backcard:active{transform:scale(.985)}

/* 知识树频道选择 */
.chpills{max-width:520px;margin:6px auto 2px;padding:0 16px;display:flex;gap:8px}
.chpills button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:13px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.chpills button.on{background:var(--card-2);color:var(--ink);border-color:var(--ink-3)}
.chpills button .dotc{width:8px;height:8px;border-radius:50%}
.chpills button .dotc.data{background:var(--data)}
.chpills button .dotc.ai{background:var(--ai)}
.chpills button .dotc.jp{background:var(--jp)}
/* 主题节点 */
.topic{margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm);overflow:hidden}
.topic .th{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.topic .th .nd{width:13px;height:13px;border-radius:50%;flex:none;border:2px solid var(--ink-3)}
.topic.has .th .nd{background:var(--data);border-color:var(--data);box-shadow:0 0 0 4px color-mix(in srgb,var(--data) 16%,transparent)}
.topic .th .nm{font-family:var(--serif);font-size:15px;font-weight:600;flex:1}
.topic .th .cnt{font-size:12px;color:var(--ink-3);margin-right:8px}
.topic .th .tg{transition:transform .3s var(--glide);color:var(--ink-3)}
.topic.open .th .tg{transform:rotate(90deg)}
.topic .body{max-height:0;overflow:hidden;transition:max-height .4s var(--glide)}
.topic.open .body{max-height:1600px}
.topic .body .pad{padding:0 14px 14px}
.topic .tsum{font-size:13px;color:var(--ink-2);line-height:1.7;background:var(--card-2);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.topic .gap{font-size:12.5px;color:var(--ink-3);padding:4px 2px 10px}
.topic .mesh{font-size:12px;color:var(--ink-2);margin:6px 0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.topic .mesh .arrow{color:var(--ink-3)}
.topic .mesh .mt{background:var(--ai-soft);color:var(--ai);border-radius:8px;padding:3px 9px}
.topic .cardrow{position:relative;display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-top:1px solid var(--line-2);cursor:pointer}
.topic .cardrow .dot{margin-top:7px;flex:none}
.topic .cardrow .ct{flex:1;min-width:0}
.topic .cardrow .ct b{font-size:13.5px;font-weight:600;display:block;line-height:1.4}
.topic .cardrow .crow{display:flex;align-items:flex-start;gap:8px}
.topic .cardrow .crow b{flex:1;min-width:0}
.topic .cardrow .crow .chip{margin-top:1px}
.topic .cardrow .ct p{font-size:12px;color:var(--ink-2);line-height:1.6;margin-top:3px}
.topic .cardrow .tags{margin-top:6px;gap:5px}
.topic .cardrow .tags span{font-size:10.5px;padding:1px 7px}
.topic .cardrow .meta{font-size:11px;color:var(--ink-3);margin-top:4px}
/* 编辑抽屉的样式已随「编辑」功能一起移除（`.38`） */

/* ---------- 待挖掘 ---------- */
.dgrp{margin-bottom:16px}
.dgrp .gh{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.06em;margin:0 2px 9px;display:flex;align-items:center;gap:7px}
.dgrp .gh .badge{background:var(--gold-soft);color:var(--gold);border-radius:20px;padding:1px 8px;font-size:11px}
.dig{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;transition:transform .15s var(--spring),box-shadow .15s}
.dig:active{transform:scale(.98);box-shadow:var(--shadow-sm)}
.dig .q{font-size:14px;font-weight:500;line-height:1.5}
/* 最外层只留：分类标签 + 日期 + 标题；「为什么推荐 / 来源 / 去挖」收进点击后的抽屉 */
.dig .dtop{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.dig .dtop .dt{margin-left:auto;font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.dig .why{font-size:11.5px;color:var(--data);margin-top:7px;display:flex;align-items:center;gap:5px}
.dig .from{font-size:11px;color:var(--ink-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:52px}
.dig .go{position:absolute;right:13px;bottom:11px;font-size:11px;color:var(--ink-3)}
.dig.done{opacity:.5}
.dig.done .go{color:var(--ink-3)}
.dig .dt{position:absolute;right:13px;top:11px;font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
/* ---------- 摘要页（第 2 层）：分类标签 + 日期 / 摘要块 / 关键词 ---------- */
.reader .rmeta{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.reader .rmeta .rdt{font-size:11.5px;color:var(--ink-3)}
.reader .rsum{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--data);border-radius:10px;padding:13px 15px;margin:0 0 12px}
.reader .rsum .rlbl{font-size:10.5px;color:var(--ink-3);letter-spacing:.16em;font-weight:600;margin-bottom:5px}
.reader .rsum .rstx{font-size:15.5px;color:var(--ink);font-weight:600;line-height:1.65}
.reader .tags{margin:0 0 14px}
/* ---------- 视图标题行 + 归档小入口 ---------- */
.viewbar{display:flex;align-items:flex-start;gap:10px}
.viewbar .sub{flex:1;min-width:0;margin:0}
.archbtn{flex:none;margin-top:1px;font-size:12px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:transform .15s var(--spring),background .15s}
.archbtn:active{transform:scale(.94);background:var(--bg)}
.archbtn b{color:var(--data);font-weight:600}
.archbtn.dim{opacity:.45}
/* ---------- 归档（全屏层） ---------- */
.arch{position:fixed;left:0;top:0;width:100%;height:100%;background:var(--bg);z-index:62;display:none;overflow:hidden}
.arch.on{display:block}
.arch .asc{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(40px + env(safe-area-inset-bottom))}
.arch .abar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:13px 18px 11px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent)}
.arch .abar .bk2{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .18s var(--spring)}
.arch .abar .bk2:active{transform:scale(.86)}
.arch .abar .at{flex:1;min-width:0;font-family:var(--serif);font-size:16px;font-weight:600}
.arch .abody{max-width:520px;margin:0 auto;padding-top:6px}
.arch .ahint{font-size:12px;color:var(--ink-3);line-height:1.75;margin:2px 0 14px}
.aitem{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);transition:transform .15s var(--spring)}
.aitem .aq{font-size:13.5px;font-weight:500;line-height:1.55;padding-right:54px}
.aitem .am{font-size:11px;color:var(--ink-3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:54px}
.aitem .arestore{position:absolute;right:11px;top:10px;font-size:11px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 10px;cursor:pointer;transition:transform .15s var(--spring)}
.aitem .arestore:active{transform:scale(.92)}
.aitem.tap{cursor:pointer}
.aitem.tap:active{transform:scale(.985)}
.arch .aempty{text-align:center;color:var(--ink-3);font-size:13px;line-height:1.9;padding:52px 10px}

/* ---------- 底部 Tabbar ---------- */
.tabbar{
  position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:520px;
  height:calc(var(--tabh) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg) 90%, transparent);
  backdrop-filter:saturate(1.6) blur(16px); -webkit-backdrop-filter:saturate(1.6) blur(16px);
  border-top:1px solid var(--line-2); display:flex; z-index:45;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--ink-3);transition:color .2s;position:relative}
.tab .ic{font-size:20px;line-height:1;transition:transform .25s var(--spring)}
.tab.on{color:var(--ink)}
.tab.on .ic{transform:translateY(-1px) scale(1.08)}
.tab .lb{font-size:10.5px;letter-spacing:.02em}
.tab .bdg{position:absolute;top:9px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:9px;background:var(--jp);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}

/* ---------- 全屏阅读器 (FLIP) ----------
   transform-origin 固定 0 0：配合 translate(卡片左上角)+scale(卡片尺寸/屏幕尺寸)，
   动画的起点与落点才能精确压在来源卡上（原先 origin 与 translate 重复计算，整体偏低约 100px）。
   will-change 让这一层常驻自己的合成层，展开/收回全程只走 GPU，不再逐帧重绘。 */
.reader{position:fixed;left:0;top:0;width:100%;height:100%;background:var(--bg);z-index:64;display:none;overflow:hidden;
  transform-origin:0 0;will-change:transform}
/* 动画期间：屏蔽点击，并关掉两件最贵的实时计算——顶栏毛玻璃、正文惯性滚动 */
.reader.anim{pointer-events:none;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.reader.anim .rbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
.reader.anim .rsc{-webkit-overflow-scrolling:auto}
.reader.on.anim .askfab{display:none}
.reader .rsc{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;padding:0 18px calc(40px + env(safe-area-inset-bottom))}
.reader .rbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:13px 18px 11px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent)}
.reader .rbar .bk2{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .18s var(--spring)}
.reader .rbar .bk2:active{transform:scale(.86)}
.reader .rbar .rt{flex:1;min-width:0;font-family:var(--serif);font-size:16px;font-weight:600}
.reader .rbody{max-width:520px;margin:0 auto;padding-top:6px}
.reader h4{font-size:13px;color:var(--ink-3);font-weight:600;margin:20px 0 8px;letter-spacing:.04em}
.reader p{font-size:14.5px;line-height:1.85;color:var(--ink-2);margin-bottom:6px}
.reader .lead{font-size:16px;color:var(--ink);font-weight:500;line-height:1.7;margin-bottom:4px}
.reader .note{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink-2);line-height:1.7;margin:14px 0}
.reader .rel{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.reader .rel span{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 11px;color:var(--ink-2)}
.reader .rel .relitem{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 11px;color:var(--ink-2);cursor:pointer;transition:transform .15s var(--spring),background .15s}
.reader .rel .relitem:active{transform:scale(.94);background:var(--bg)}
.reader .fullbtn{display:block;width:100%;text-align:center;background:#e8604c;color:#fff;border:none;border-radius:12px;padding:12px 0;font-size:14px;font-weight:600;text-decoration:none;font-family:inherit;cursor:pointer;margin:14px 0 2px}
.reader .fullbtn:active{opacity:.85}
.sheet .sheetgo{display:block;text-align:center;background:var(--ai);color:#fff;border-radius:12px;padding:12px 0;font-size:14px;font-weight:600;text-decoration:none;margin:12px 0 2px}
.sheet .sheetgo:active{opacity:.85}
/* 「标记为已读」按钮已按需求删除：改为在列表里向左滑卡片翻面即视为已读 */
/* ===== 提问悬浮球（摘要页右下角）：收起是一颗圆球，点一下就地展开成输入条 ===== */
.askfab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));width:calc(100% - 36px);max-width:488px;z-index:70;display:none;flex-direction:column;gap:9px;pointer-events:none}
.reader.on .askfab{display:flex}
.askfab>*{pointer-events:auto}
.fabrow{display:flex;justify-content:flex-end;align-items:flex-end}
.fabball{width:54px;height:54px;border-radius:50%;background:var(--fab-bg);border:1px solid var(--fab-line);box-shadow:var(--fab-shadow);display:flex;align-items:center;justify-content:center;color:var(--fab-fg);cursor:pointer;flex:none;padding:0;transition:transform .16s var(--spring),background .28s ease,color .28s ease,border-color .28s ease}
.fabball:active{transform:scale(.92)}
.fabball svg{width:26px;height:26px;display:block}
/* 图标里「前面那个气泡」的填充必须跟球底色一致，否则换成深色球后会露出一个白方块 */
.fabball .fabmask{fill:var(--fab-bg);transition:fill .28s ease}
.fabbar{flex:1;display:none;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:6px;box-shadow:0 10px 28px -10px rgba(0,0,0,.32)}
.askfab.on .fabball{display:none}
.askfab.on .fabbar{display:flex}
.fabbar textarea{flex:1;border:none;background:transparent;padding:8px 10px;font-size:13.5px;color:var(--ink);resize:none;height:38px;font-family:inherit;outline:none}
.fabbar #qaSend{background:var(--ai);color:#fff;border:none;border-radius:10px;padding:0 15px;height:36px;font-size:13px;font-weight:600;cursor:pointer;flex:none;font-family:inherit}
.fabbar #fabDown{width:34px;height:36px;border:none;background:transparent;color:var(--ink-3);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.fabbar #fabDown svg{width:16px;height:16px;display:block}
/* ===== 日语跟读（手机自带朗读，零成本）：逐句列出、点一下念 ===== */
.jpblk{margin-top:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px}
.jpblk .jph{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:9px}
.jpblk .jph .jpn{color:var(--ink-3);font-weight:400}
.jpblk .jpl{display:flex;flex-direction:column;gap:7px}
.jpblk .jpline{display:flex;align-items:flex-start;gap:9px}
.jpblk .jpplay{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s var(--spring),background .2s,border-color .2s}
.jpblk .jpplay:active{transform:scale(.9)}
.jpblk .jpplay.on{background:var(--jp);border-color:var(--jp)}
.jpblk .jptx{flex:1;font-size:14.5px;line-height:1.6;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;word-break:break-word}
/* ---------- 跟读练习（App 内全屏打开日语卡的完整学习卡，真人音频不外跳） ---------- */
.jpread{position:fixed;left:0;top:0;width:100%;height:100%;background:var(--bg);z-index:66;display:none;flex-direction:column}
.jpread.on{display:flex}
.jpread .jprbar{display:flex;align-items:center;gap:10px;padding:13px 14px 11px;border-bottom:1px solid var(--line-2);background:color-mix(in srgb,var(--bg) 92%,transparent);flex:none}
.jpread .jprbar .bk2{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .18s var(--spring);flex:none}
.jpread .jprbar .bk2:active{transform:scale(.86)}
.jpread .jprbar .rt{flex:1;min-width:0;font-family:var(--serif);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jpread .jprbar .jpex{flex:none;font-size:12px;color:var(--ink-3);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.jpread .jpload{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;line-height:2;text-align:center;padding:0 30px}
.jpread .jpfrm{flex:1;width:100%;border:0;background:#fff}
.jpread .jpfrm.hide{display:none}
/* 卡片内问答 + 兴趣 */
.qa{max-width:520px;margin:14px auto 0;padding:0 16px 8px}
.qa .qah{font-size:13px;color:var(--ink-2);margin-bottom:8px;font-weight:600}
.qa .qalist{display:flex;flex-direction:column;gap:8px;margin:12px 0 10px}
.qa .qaitem{background:var(--card-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.6}
.qa .qaitem .qq{color:var(--ink)}
.qa .qaitem .qa{color:var(--data);margin-top:3px}
.qa .qaitem .qpend{color:var(--ink-3);font-size:12px;margin-top:3px}
.qa .qempty{color:var(--ink-3);font-size:12.5px;margin-bottom:10px}
.qa .qain{display:flex;gap:8px}
.qa .qain textarea{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--ink);resize:none;height:42px;font-family:inherit}
.qa .qain button{background:var(--ai);color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer}
/* 问答 tab */
.qaWrap{max-width:520px;margin:0 auto;padding:4px 16px 24px}
.qsec{margin-top:14px}
.qsh{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{background:var(--ai-soft);color:var(--ai);border-radius:8px;padding:5px 11px;font-size:12.5px}
/* 旧「紧凑问答列表」样式已废弃（问答 tab 重构后由 .qgrp / .qitem(298+) 接管），删除避免重复定义 */
.recCard{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-2);cursor:pointer}
.recCard .dot{margin-top:7px;flex:none}
.recCard .ct{flex:1;min-width:0}
.recCard .ct b{font-size:13.5px;font-weight:600;display:block;line-height:1.4}
.recCard .ct p{font-size:12px;color:var(--ink-2);line-height:1.6;margin-top:3px}
/* 紧凑问答列表 + 关注专题 */
.qrow{display:flex;align-items:center;gap:9px;padding:11px 2px;border-top:1px solid var(--line-2);cursor:pointer}
.qrow .qdot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.qrow .qdot.done{background:var(--data)}
.qrow .qtitle{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .qchev{color:var(--ink-3);font-size:16px;flex:none}
.qfull{padding:6px 2px 12px 17px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.qfull .qa{color:var(--data);margin-top:4px}
/* 问答 tab 重构：统计 / 筛选 / 新建 / 知识点分组 */
.qah2{font-size:13px;color:var(--ink-2);margin:12px 0 6px;font-weight:600}

/* 提问后当场显示 AI 答案的区域（原先要等约 1 小时） */
.qaans{background:var(--card-2);border-left:3px solid var(--ai);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;line-height:1.75;color:var(--ink);white-space:pre-wrap;word-break:break-word;margin-top:10px;max-height:46vh;overflow:auto}
.qaans.wait{border-left-color:var(--ink-3);color:var(--ink-2)}
.qaans.bad{border-left-color:var(--jp);color:var(--jp)}
/* 结构化回答（对齐正式卡片的排版：摘要 / 导读 / 分点 / 标签） */
.qaans.rich{white-space:normal}
.qaans .aSum{font-size:14px;font-weight:600;color:var(--ink);line-height:1.65;margin-bottom:7px}
.qaans .aLead{font-size:12.5px;color:var(--ink-2);line-height:1.7;padding-bottom:9px;margin-bottom:9px;border-bottom:1px dashed var(--line)}
.qaans .aPts{display:flex;flex-direction:column;gap:8px}
.qaans .aPt{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.72;color:var(--ink-2)}
.qaans .aNum{flex:none;width:17px;height:17px;border-radius:50%;background:var(--ai-soft);color:var(--ai);font-size:10.5px;font-weight:700;line-height:17px;text-align:center;margin-top:3px}
.qaans .aTxt b{color:var(--ink)}
.qaans .aTags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.qaans .aTag{font-size:11.5px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:var(--ink-3)}
.qaans .aFoot{margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.6}
/* 长回答折叠（.28）：先露一截，底下的「展开完整回答」点开看全部；内容没超出就不显示按钮 */
.coll{max-height:320px;overflow:hidden;position:relative;transition:max-height .36s ease}
.coll.open{max-height:none}
.coll.can:not(.open){-webkit-mask-image:linear-gradient(180deg,#000 58%,rgba(0,0,0,0));mask-image:linear-gradient(180deg,#000 58%,rgba(0,0,0,0))}
.cbtn{display:none;width:100%;margin-top:9px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;color:var(--ink-2);font-size:13px;font-weight:600;padding:9px 12px;cursor:pointer;font-family:inherit;transition:background .18s}
.cbtn:active{background:var(--line)}
.cbtn.on{display:block}
.qregen{display:block;width:100%;margin-top:9px;background:var(--ai-soft);color:var(--ai);border:1px solid var(--ai);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.qregen:active{background:var(--ai);color:#fff}
.qstat{font-size:13px;color:var(--ink-2);background:var(--card-2);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.qstat b{color:var(--ink);font-weight:700}
.qfilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qnew{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.qnew textarea{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--ink);resize:none;height:48px;font-family:inherit;box-sizing:border-box}
.qnewrow{display:flex;gap:8px;margin-top:8px}
.qnewrow input{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--ink);box-sizing:border-box}
.qnewrow button,.qlink{background:var(--ai);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.qgrp{margin-bottom:14px}
.qgrph{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:7px;padding-left:2px}
.qitem{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.qitem.ig{opacity:.5}
.qitem .qq{font-size:14px;font-weight:600;line-height:1.5}
.qmeta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.qsrc{font-size:11.5px;color:var(--ink-3)}
.qdate{font-size:11px;color:var(--ink-3);margin-left:auto;flex:none}
.qbadge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.b-pending{background:#fff3df;color:#b8740a}
.b-pushed{background:#e6f4ea;color:#1f8a4c}
.b-read{background:#e8eefc;color:#2f5fd0}
.b-ignored{background:#f0f0f0;color:#888}
.qacts{display:flex;gap:8px;margin-top:7px;align-items:center}
.qignore{background:none;border:1px solid var(--line);color:var(--ink-3);border-radius:9px;padding:6px 12px;font-size:12px;cursor:pointer}
.qhint{font-size:11.5px;color:var(--ink-3)}

/* ---------- 底部抽屉 ---------- */
.sheet-mask{position:fixed;inset:0;background:rgba(20,18,14,.32);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;bottom:0;width:100%;max-width:520px;margin:0 auto;left:50%;transform:translate(-50%,100%);z-index:56;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px -12px rgba(0,0,0,.4);padding:8px 18px calc(24px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .42s var(--spring)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grip{width:38px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 14px}
.sheet .sh{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:4px}
.sheet p{font-size:14px;color:var(--ink-2);line-height:1.8;margin-bottom:8px}
.sheet .shtag{font-size:11.5px;color:var(--data);margin-bottom:12px}

/* ---------- 长按面板（水波纹灌注） ---------- */
.lp{position:absolute;inset:0;border-radius:var(--r);background:var(--ink);color:var(--card);z-index:5;display:flex;flex-direction:column;justify-content:center;padding:18px;gap:12px;
  clip-path:circle(0px at 50% 50%);transition:clip-path .42s var(--glide);pointer-events:none}
.lp.show{pointer-events:auto}
.lp.show.go{clip-path:circle(150% at var(--ox,50%) var(--oy,50%))}
.lp .lt{font-size:13px;opacity:.7;letter-spacing:.1em}
.lp .acts{display:flex;gap:10px}
.lp .acts button{flex:1;background:color-mix(in srgb,var(--card) 14%,transparent);border:1px solid color-mix(in srgb,var(--card) 30%,transparent);color:var(--card);border-radius:11px;padding:13px 0;font-size:14px;cursor:pointer;transition:transform .15s var(--spring)}
.lp .acts button:active{transform:scale(.95)}
/* 水波纹层 */
.ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--data) 55%,transparent),transparent 70%);transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:1}
/* 标签选择浮层 */
.tagpick{display:none;flex-wrap:wrap;gap:8px;margin-top:10px}
.tagpick.on{display:flex}
.tagpick span{font-size:12.5px;border:1px solid var(--line);background:var(--card-2);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink-2)}
.tagpick span.on{background:var(--data);color:#fff;border-color:var(--data)}
.tagpick input{flex:1;min-width:120px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--ink)}
.empty{text-align:center;color:var(--ink-3);font-size:13px;padding:40px 0;line-height:1.8}
.sub{font-size:12px;color:var(--ink-3);margin:2px 0 12px}
.search{position:relative;margin:0 0 12px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px 14px 11px 38px;font-size:14px;color:var(--ink)}
.search::before{content:none}
.search .clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:18px;cursor:pointer;display:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:20px;font-size:13px;z-index:80;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab .ic svg{width:23px;height:23px}
.chan .ic svg{width:24px;height:24px}
.seg .ic svg{width:15px;height:15px;stroke-width:1.8}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px}
.gh .ic svg{width:16px;height:16px}
.th .ic svg{width:18px;height:18px}
.sic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);display:flex;pointer-events:none}
.sic svg{width:16px;height:16px;stroke-width:1.8}
.star.on svg{fill:currentColor}
.lp .acts button{display:flex;align-items:center;justify-content:center;gap:7px}
.lp .acts .ic svg{width:17px;height:17px}
/* ---------- 下拉刷新 / 刷新按钮 ---------- */
.ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-3);font-size:12.5px;letter-spacing:.05em}
.ptr .ptr-ic{display:inline-flex}
.ptr .ptr-ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s cubic-bezier(.22,1,.36,1)}
.ptr.go .ptr-ic{transform:rotate(180deg)}
.ptr .ptr-ic.spin{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
#refreshBtn:active{transform:scale(.86)}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-apple.png">
</head>
<body>
<div class="hdr" id="hdr">
  <div class="hdr-in">
    <button class="bk" id="backBtn"><span class="ic"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span></button>
    <div class="tt"><b id="hdrTitle">知识工作台</b><span id="hdrSub">今天 · 10月3日 周六</span></div>
    <button class="tbtn" id="themeBtn" title="切换深色"><span class="ic" id="themeIc"></span></button>
    <button class="tbtn" id="refreshBtn" title="刷新推送"><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></span></button>
  </div>
</div>

<div class="wrap" id="wrap">
  <!-- 今日 -->
  <section class="view active" data-view="today">
    <div id="ptr" class="ptr"><span class="ptr-ic"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg></span><span class="ptr-tx">下拉刷新</span></div>
    <div class="pbar">
      <div class="pt"><span>今日进度</span><b id="pTxt">3 / 4 已完成</b></div>
      <div class="track"><i id="pFill" style="width:75%"></i></div>
    </div>
    <div id="todayList"></div>
  </section>

  <!-- 频道 -->
  <section class="view" data-view="channels">
    <div class="search"><span class="ic sic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4"/></svg></span><input id="chanSearch" placeholder="搜全部内容：概念 / 假名 / 主题…"><span class="clr" id="chanClr">×</span></div>
    <div id="chanPortal"></div>
    <div id="chanList" style="display:none"></div>
    <div id="searchRes" style="display:none"></div>
  </section>

  <!-- 知识树 -->
  <section class="view" data-view="tree">
    <div class="chpills" id="treeChPills">
      <button data-ch="data"><span class="dotc data"></span>数据</button>
      <button data-ch="ai"><span class="dotc ai"></span>AI</button>
      <button data-ch="jp"><span class="dotc jp"></span>日语</button>
    </div>
    <div class="sub" style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
      <span id="treeHint">按主题梳理知识结构</span>
    </div>
    <div class="seg">
      <button id="segList" class="on"><span class="ic"><svg viewBox="0 0 24 24"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg> 列表</button>
      <button id="segMap"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 4.2v4.2"/><circle cx="12" cy="10.9" r="2.5"/><path d="M12 13.4v1.6c0 1.7-2.1 2.3-4.8 2.3H7"/><path d="M12 16.4c0 1.7 2.1 2.3 4.8 2.3H17"/><circle cx="4.8" cy="17.6" r="2.2"/><circle cx="19.2" cy="17.6" r="2.2"/></svg> 梳理</button>
    </div>
    <div id="treeList"></div>
    <div id="treeMap" style="display:none">
      <div id="shuliBody"></div>
    </div>
  </section>

  <!-- 待挖掘 -->
  <section class="view" data-view="dig">
    <div class="viewbar">
      <p class="sub">系统从你的兴趣信号里攒下的「可往下钻」线索。<b>只看没看过的</b>，点开看过一条，它就自动收进「归档」——眼前永远是新的。不想留的，<b>按住往右滑可粉碎</b>。</p>
      <button class="archbtn" id="digArchBtn">归档 <b>0</b> ›</button>
    </div>
    <div id="digList"></div>
  </section>

  <!-- 问答 / 兴趣 -->
  <section class="view" data-view="qa">
    <div class="viewbar">
      <p class="sub">针对任意卡片提问，问题按「知识点」归组，<b>组内从新到旧</b>。提问后 AI 立刻回答，并存成一份详解卡——既在今日流出现，也链在这里；已读 / 已忽略的自动收进归档。</p>
      <button class="archbtn" id="qaArchBtn">归档 <b>0</b> ›</button>
    </div>
    <div class="qaWrap">
      <div class="qstat" id="qaStat"></div>
      <div class="qfilters" id="qaFilters">
        <button class="filter on" data-f="all">全部</button>
        <button class="filter" data-f="pending">待生成</button>
        <button class="filter" data-f="pushed">已推送</button>
        <button class="filter" data-f="arch">归档</button>
      </div>
      <div class="qnew">
        <textarea id="qaNewQ" placeholder="直接提个问题（不必选卡，AI 自动归到知识点）…"></textarea>
        <div class="qnewrow"><input id="qaNewKp" placeholder="知识点（可留空，让 AI 自动归类）"><button id="qaNewSend">新建提问</button></div>
        <div class="qaans" id="qaNewAns" style="display:none"></div>
      </div>
      <div id="qaGroups"></div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="filter" id="backupBtn">备份到文件</button>
        <button class="filter" id="restoreBtn">从文件恢复</button>
        <input type="file" id="restoreFile" accept="application/json" style="display:none">
      </div>
    </div>
  </section>
</div>

<!-- 底部导航 -->
<nav class="tabbar" id="tabbar">
  <div class="tab on" data-tab="today"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17"/><path d="M8 2.5v4"/><path d="M16 2.5v4"/><circle cx="12" cy="14.5" r="1.4"/></svg></div><div class="lb">今日</div></div>
  <div class="tab" data-tab="channels"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5-8 4.5-8-4.5 8-4.5z"/><path d="M4 12l8 4.5 8-4.5"/><path d="M4 16l8 4.5 8-4.5"/></svg></div><div class="lb">频道</div></div>
  <div class="tab" data-tab="tree"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M6 8.4v7.2"/><path d="M8.2 7.1l7.4 3.5"/><path d="M8.2 16.9l7.4-3.5"/></svg></div><div class="lb">知识树</div></div>
  <div class="tab" data-tab="dig"><div class="ic"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.4 10.9c.7.5 1.1 1.3 1.2 2.1h4.4c.1-.8.5-1.6 1.2-2.1A6 6 0 0 0 12 3z"/></svg></div><div class="lb">待挖掘</div><span class="bdg" id="digBdg">0</span></div>
  <div class="tab" data-tab="qa"><div class="ic"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 1 1-8-8"/><path d="M12 8v4l3 2"/><path d="M19 4l2 2-2 2"/></svg></div><div class="lb">问答</div><span class="bdg" id="qaBdg">0</span></div>
</nav>

<!-- 全屏阅读器 -->
<div class="reader" id="reader">
  <div class="rsc" id="rsc">
    <div class="rbar">
      <div class="bk2" id="readerClose"><span class="ic"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span></div>
      <div class="rt" id="readerTitle"></div>
    </div>
    <div class="rbody" id="readerBody"></div>
    <div class="qa" id="qaBox" style="display:none">
      <button class="qregen" id="qaRegen" style="display:none">这张卡内容看着旧？让 AI 按最新资料重讲一遍</button>
      <div class="qalist" id="qaList"></div>
    </div>
  </div>
  <!-- 「标记为已读」按钮已删除：现在在列表里向左滑卡片、翻面盖章即视为已读 -->
  <!-- 提问悬浮球：收起是一颗圆球，点一下就地展开成输入条；答案显示在它上方 -->
  <div class="askfab" id="askFab">
    <div class="qaans" id="qaAns" style="display:none"></div>
    <div class="fabrow">
      <div class="fabbar" id="fabBar">
        <textarea id="qaText" placeholder="对这张卡有啥没懂的？直接问…"></textarea>
        <button id="qaSend">提问</button>

     ① 主题名命中 = 最强信号（+100）—— 主题名是这张卡的"正主"
     ② 关键词命中：越长的关键词越具体，权重越高（+ 关键词长度，最多 20）
     ③ 平手时取主题列表里靠前的那个（你在「编辑」里的顺序＝优先级）
   一个都没命中 → 返回 null，卡片进「未分类卡片」。 */
function pickTopicId(ch,card){
  var text=((card.title||"")+" "+(card.tags?card.tags.join(" "):"")+" "+(card.sum||"")).toLowerCase();
  var best=null,bestScore=0;
  (TOPICS[ch]||[]).forEach(function(t){
    var s=0,nm=String(t.name||"").toLowerCase();
    if(nm&&text.indexOf(nm)>=0)s+=100;
    (t.kw||[]).forEach(function(k){var kk=String(k||"").toLowerCase();if(kk&&text.indexOf(kk)>=0)s+=Math.min(kk.length,20);});
    if(s>bestScore){bestScore=s;best=t.id;}
  });
  return best;
}
/* 构建某频道的主题结构（含命中卡片、凝练摘要、延伸连线、未分类卡片） */
function buildChannelTree(ch){
  var topics=(TOPICS[ch]||[]).map(function(t){return Object.assign({},t);});
  var cardByTopic={};
  CARDS.forEach(function(c){if(normCh(c.ch)!==ch)return;var tid=pickTopicId(ch,c);   /* 只归一个主题 */
    if(tid)(cardByTopic[tid]=cardByTopic[tid]||[]).push(c);});
  topics.forEach(function(t){t.cards=cardByTopic[t.id]||[];t.hasCards=t.cards.length>0;
    var parts=t.cards.map(function(c){return c.sum;}).filter(Boolean);
    t.summary=parts.join("　").slice(0,160);
    var tagSet={};t.cards.forEach(function(c){(c.tags||[]).forEach(function(g){tagSet[g]=1;});});
    t.tags=Object.keys(tagSet);
  });
  var unmatched=CARDS.filter(function(c){if(normCh(c.ch)!==ch)return false;return !pickTopicId(ch,c);});
  var edges=(MESH[ch]||[]).filter(function(e){return e.a!==e.b;});
  return {ch:ch,topics:topics,unmatched:unmatched,edges:edges};
}

   第 1 次返回后守卫没落上 → 第 2 次返回就直接离开 App，连 popstate 都不触发（界面来不及关）。
   ⇒ 对策：把历史条目在**用户操作时就垫实**——每进一层 push 一条（带层名 nav），
      每次返回都落到一条**真实存在**的条目上，不再依赖「临时补」。 */
function pushNav(e){ if(navStack.length&&navStack[navStack.length-1]===e)return; navStack.push(e); _exitReady=false; try{ history.pushState({kbGuard:true,nav:e},""); }catch(err){} }
/* navBack：界面上的「返回」按钮 / 关闭按钮 都走这里。
   策略：统一触发浏览器 back()，让 popstate 成为唯一决策入口——
   这样按钮点击与系统侧滑走同一条路径，行为完全一致、不会两套逻辑打架。 */
function navBack(){
  var hasLayer = navStack.length>1 || !!document.querySelector(".lp.show") || (curView==="channels"&&chanDrill) || (curView==="tree"&&treeMode==="shuli"&&shuliDrill) || reader.classList.contains("on") || sheet.classList.contains("on") || (archEl&&archEl.classList.contains("on")) || (cdlg&&cdlg.classList.contains("on")) || (jpRead&&jpRead.classList.contains("on")) || (askFab&&askFab.classList.contains("on")) || (srSheet&&srSheet.classList.contains("on"));
  if(!hasLayer) return;   // 首页：交给历史哨兵/popstate 处理（会弹提示），这里不直接退桌
  var _t0=Date.now();          /* 本次 back 发起的时刻：兜底判据的基准线 */
  clearTimeout(_nbWatch);
  _nbWatch=setTimeout(function(){
    /* 兜底：260ms 内**完全没有 popstate 到来**，才自己回退一层，并补平守卫账。
       ⚠ 判据只能看"popstate 是否在本次 back 之后来过"（_lastPopAt≥_t0），
       不能用"层栈长度变没变"——有的返回只收起浮层（长按面板 / 输入条），
       本就不改变层栈长度；旧判据（长度不变+距上次 popstate>200ms）会把它们
       误判成"back 没生效"，260ms 后再多退一层。（`.31` 修） */
    if(_lastPopAt<_t0){ _nbFallbackAt=Date.now(); navBackFromPop(); _guardSoon(); }
  },260);
  try{ history.back(); }catch(e){ clearTimeout(_nbWatch); _nbFallbackAt=Date.now(); navBackFromPop(); _guardSoon(); }
}

/* ====================== 系统返回手势接管（history 守卫模型）======================
   ⚠ 核心事实（实测 + 权威结论）：
   1) 真机「左/右边缘侧滑」= 系统级返回手势，触发浏览器 history.back()，
      **不会命中我们绑定的 touch 事件**。旧实现只监听 touch → 真机侧滑 = 浏览器直接退到底 = 关 App。
   2) Android 全屏 PWA 中，网页**无法**用脚本主动关闭 App（history.back() 调多少次都没用）；
      只有“用户真实触发返回、且当前无历史可退”时，系统才会关 App。
   ⇒ 正确做法（MDN/StackOverflow 经典“守卫记录”法）：让 App 历史里永远垫着一条**守卫**状态，
     用户返回时先落到守卫 → 我们在 popstate 里决定：做一次界面回退（并补回守卫），
     或（已在首页）提示/放行。放行时不再补守卫，用户再一次返回即退出。

   实现（极简模型）：
   - _backGuard()：push 一条 {kbGuard:true}，App 内部的“可后退垫片”。
   - 进层/回首页后，保证恰有 1 条守卫压在顶层（_ensureGuard）。
   - popstate：无论退到哪种 state，都视为“用户按了一次返回”：
        · 若还有界面层级可退 → navBackFromPop()，然后 _ensureGuard() 补守卫（App 不退）；
        · 若已在首页 → 首页退桌流程（首次提示+补守卫；2秒内再次则放行不再补守卫）。
   - 因为只有 1 条守卫、且放行时不补，历史终会露出“App 之外”的条目 → 系统关 App 回桌面。
   ============================================================== */
var _exitArmed=false;      // 首页已进入「再退一次就退桌」待命态

/* 返回后的滚动位置由脚本自己接管（见 fixScrollBack）：关掉浏览器自带的还原，免得两边打架 */
try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}

function _ensureGuard(){ try{ if(!(history.state&&history.state.kbGuard)) history.pushState({kbGuard:true},""); }catch(e){} }

/* _guardSoon：补守卫的"稳"版（`.32` 修）。
   ⚠ 真机（Android 系统返回手势）实测机理：**返回手势进行中调 history.pushState 会被浏览器忽略**
   （返回导航尚未提交），此时在 popstate 里补守卫＝补了个寂寞 → 垫底守卫丢失 →
   下一次返回已无历史可退 → 直接离开 App（真机=退回桌面，界面还来不及关就没了）。
   桌面 history.back() 是纯 JS 调用、没有这个"手势窗口"，所以桌面自检永远测不出来。
   对策：立即补一次，再在 rAF / 60 / 200 / 400 / 700ms 各补一次（幂等）——
   覆盖"手势提交完成"之后的时间窗，总有一次落在有效时机。
   _exitReady（已放行退桌）时停手，免得把用户该走的那次返回又拦住。 */
var _exitReady=false, _guardTimers=[];
function _guardSoon(){
  if(_exitReady) return;
  _ensureGuard();
  try{ requestAnimationFrame(function(){ if(!_exitReady) _ensureGuard(); }); }catch(e){}
  [60,200,400,700].forEach(function(ms){
    _guardTimers.push(setTimeout(function(){ if(!_exitReady) _ensureGuard(); }, ms));
  });
}
function _clearGuardSoon(){ try{ _guardTimers.forEach(clearTimeout); }catch(e){} _guardTimers=[]; }

/* 【`.35`】非返回方式关闭浮层时，把它占的那条历史条目「还回去」（静默 back），
   保证「导航栈 ↔ 历史条目」始终一一对应。
   ⚠ 否则会两种错位，且在后续每一次返回里累积：
     ① 只关界面、不还条目 → 用户按返回时「白按一次」（条目留着没人用）；
     ② 只 splice 导航栈、不还条目 → 用户按返回时「多退一层」（栈被提前 pop）。
   ⚠ 真机上这正是继"返回后补 pushState 假成功"之后的第二个坑。（`.35` 审计发现） */
var _silentBack=0;
function _dropNav(name){ var k=navStack.lastIndexOf(name); if(k>=0)navStack.splice(k,1); }
function _closeLayerByCode(name, closeFn){
  var i=navStack.lastIndexOf(name);
  if(i>=0){ navStack.splice(i,1); _silentBack++; try{ history.back(); }catch(e){ _silentBack--; } }
  try{ closeFn(); }catch(e){}
}

// 进入新层/开卡/进一级页/开抽屉：直接调用 _ensureGuard() 补守卫（见 openReader / openSheet / switchTab）
// 回首页时调用：重置退桌待命态，并保证守卫在位
/* 回首页：重置退桌待命态，并 **push 一条新的 home 条目**（`.34`）。
   push 会**截断指针之后的多余条目**，所以历史总能收敛回 `[kbHome, gHome]` 两条——
   这样「在今日按返回：第 1 次提示、第 2 次退出」这个预期才成立。 */
function resetHistoryToHome(){ _exitArmed=false; _exitReady=false; clearTimeout(armT); try{ history.pushState({kbGuard:true,nav:"home"},""); }catch(e){} }

/* 守卫心跳（`.32` 新增）：兜住"手势期间补守卫被忽略"的真机偶发——
   只要 App 里还有层可退、且不在退桌待命/放行态，就把垫底守卫补回来（幂等：无守卫才 push）。
   与"多拍补守卫"是双保险：多拍管"这次返回后几百毫秒内补上"，心跳管"万一还是漏了，半秒内必补"。 */
setInterval(function(){
  try{
    if(_exitArmed || _exitReady) return;
    if(navStack.length>1 && !(history.state && history.state.kbGuard)) _ensureGuard();
  }catch(e){}
},400);

window.addEventListener("popstate",function(){
  /* `.35`：这是"程序性关闭浮层"顺带触发的静默返回 —— 界面已经关过了，这里不做任何回退。 */
  if(_silentBack>0){ _silentBack--; _lastPopAt=Date.now(); clearTimeout(_nbWatch); return; }
  /* 刚才兜底回退可能引发的"回响/迟到"返回：界面不再重复退（兜底已退过），
     但 **账必须补平**——这次 popstate 已经消耗了一条历史（back 生效只是迟到），
     不补守卫的话账目会亏空；亏到"指针落在文档最底"时，用户的下一次侧滑
     就会直接离开 App（真机=退到桌面）。（`.31` 修） */
  if(Date.now()-_nbFallbackAt<420){ _lastPopAt=Date.now(); clearTimeout(_nbWatch); _guardSoon(); return; }
  _lastPopAt=Date.now(); clearTimeout(_nbWatch);   /* 系统返回真来了 → 撤掉兜底，避免重复回退 */
  // 一次用户返回（系统侧滑/返回键）
  var hasLayer = navStack.length>1 || !!document.querySelector(".lp.show")
              || (curView==="channels"&&chanDrill)
              || (curView==="tree"&&treeMode==="shuli"&&shuliDrill)
              || reader.classList.contains("on") || sheet.classList.contains("on")
              || (archEl&&archEl.classList.contains("on")) || (cdlg&&cdlg.classList.contains("on"))
              || (jpRead&&jpRead.classList.contains("on")) || (askFab&&askFab.classList.contains("on"))
              || (srSheet&&srSheet.classList.contains("on"));
  if(hasLayer){
    navBackFromPop();     // 做一次界面回退
    _guardSoon();         // 补回守卫（多拍，防真机手势期间 pushState 被忽略），App 不退，还能继续逐级退
    return;
  }
  // 已在首页：退桌流程
  if(!_exitArmed){
    _exitArmed=true;
    toast("再侧滑一次，将退到桌面");
    clearTimeout(armT);
    armT=setTimeout(function(){ _exitArmed=false; },DISARM); // 到期仅重置，不补守卫
    _guardSoon();         // 拦住：补回守卫，App 不退
    return;
  }
  // 已待命：放行——不再补守卫；用户的下一次返回将退到 App 之外，由系统关闭 App。
  _exitArmed=false; _exitReady=true; _clearGuardSoon(); clearTimeout(armT);
});

// 供 popstate 使用的「只做界面回退、不再动历史」的版本
function navBackFromPop(){
  var top=navStack[navStack.length-1];
  /* `.35`：长按面板 / 提问输入条 / 频道下钻 / 梳理下钻 —— 这四类界面现在也各占一条**真实历史条目**，
     所以按「栈顶匹配」pop 掉自己那一层。
     （旧版它们不占条目 → 真机上"用返回收起它"会白吃上一层的历史，累积后提前掉出 App。） */
  if(top==="lp"){ navStack.pop(); var _lp0=document.querySelector(".lp.show"); if(_lp0)closeLp(_lp0); return; }
  if(top==="askFab"){ navStack.pop(); closeAskFab(); return; }
  if(top==="chanDrill"){
    navStack.pop(); chanDrill=false;
    document.getElementById("chanPortal").style.display="";
    document.getElementById("chanList").style.display="none";
    hdrSub.textContent=TAB_META.channels[1]; setBk(false); cancelScrollFix(); window.scrollTo(0,0); return;
  }
  if(top==="shuliDrill"){ navStack.pop(); shuliDrill=null; renderShuli(); cancelScrollFix(); window.scrollTo(0,0); return; }
  /* 兜底：栈里没登记、但面板 / 输入条还开着（异常态）→ 至少收掉它，别把人挡着 */
  var _lp0=document.querySelector(".lp.show");
  if(_lp0){ closeLp(_lp0); return; }
  if(askFab&&askFab.classList.contains("on")){ closeAskFab(); return; }
  if(top==="jpRead"){ navStack.pop(); closeJpRead(); return; }
  if(top==="cdlg"){ navStack.pop(); closeCrushDlg(); return; }
  if(top==="arch"){ navStack.pop(); closeArch(); return; }
  if(top==="reader"){ navStack.pop(); closeReader(); return; }
  if(top==="sheet"){ navStack.pop(); closeSheet(); return; }
  if(top==="srSheet"){ navStack.pop(); closeSrSheet(); return; }
  if(navStack.length<=1){ return; }
  navStack.pop();
  var t=navStack[navStack.length-1];
  if(archEl&&archEl.classList.contains("on"))closeArch();
  if(reader.classList.contains("on"))closeReader();
  if(sheet.classList.contains("on"))closeSheet();
  if(srSheet&&srSheet.classList.contains("on"))closeSrSheet();
  if(jpRead&&jpRead.classList.contains("on"))closeJpRead();
  if(t==="home"){ switchTab("today"); return; }
  /* 一级页不互相叠栈：万一栈里还留着历史遗留的 tab 层，也一律回「今日」，
     不再"回到上一个访问过的标签页"（本版起的新策略）。 */
  if(t.indexOf("tab:")===0){ navStack=["home"]; switchTab("today"); return; }
}

/* 关键词标签：
   · 摘要页（all=true）→ 全部展开，可换行
   · 最外层（all=false）→ 只占一行：渲染后按真实像素宽度量，放得下几个就显示几个，
     放不下的收成「+N」（数量不写死：屏幕宽就多放一个，窄就少放一个） */
var TAG_GAP=6;
function tagsHTML(c,all){
  var t=(c&&c.tags)?c.tags:[];if(!t.length)return "";
  var h='<div class="tags'+(all?'':' one')+'">'
    +t.map(function(x){return '<span class="tag">'+esc(x)+'</span>';}).join("");
  if(!all)h+='<span class="tmore" style="display:none"></span>';
  return h+'</div>';
}
/* 把「一行放不下的关键词」收成「+N」——按真实宽度测量，绝不写死个数 */
function fitTagLines(root){
  var scope=(root&&root.querySelectorAll)?root:document;
  var boxes=scope.querySelectorAll(".tags.one");
  for(var i=0;i<boxes.length;i++)fitOneTagLine(boxes[i]);
}
function fitOneTagLine(box){
  var spans=box.querySelectorAll("span.tag"),more=box.querySelector(".tmore");
  if(!more||!spans.length)return;
  for(var i=0;i<spans.length;i++)spans[i].style.display="";
  more.style.display="none";
  var avail=box.clientWidth;
  if(!avail)return;                     /* 视图被隐藏（display:none）时量不出宽度，切到该页时会重新量 */
  var w0=0;
  for(var i=0;i<spans.length;i++)w0+=spans[i].offsetWidth+(i?TAG_GAP:0);
  if(w0<=avail)return;                  /* 一行放得下：全部显示 */
  for(var k=spans.length-1;k>=0;k--){
    spans[k].style.display="none";
    var shown=0,w=0;
    for(var j=0;j<spans.length;j++){
      if(spans[j].style.display!=="none"){w+=spans[j].offsetWidth+(shown?TAG_GAP:0);shown++;}
    }
    more.textContent="+"+(spans.length-shown);
    more.style.display="";
    if(!shown||w+TAG_GAP+more.offsetWidth<=avail)return;
  }
}
var _fitT=null;

/* 地图（主题网状，聚焦模式） */
/* ====================== 梳理视图（从卡片里提炼「图」） ======================
   定位：知识树里「列表说卡、梳理说图」。列表按主题列卡片；梳理把卡片里的知识
   提炼成「一眼能扫懂」的图（先后→流程图、包含→思维导图、对比→表格），
   只回答一件事：学过的这块知识，整体长成什么样、彼此什么关系。
   生成：进视图时自动触发；有缓存直接用，来了新卡只重跑受影响的主题（增量），
   逐主题串行调 AI，每完成一步就落一次盘（中途关页面不白干、下次续跑）。 */
var LS_SHULI="kb_shuli";
var SHULI_GEN_VER=1;                 /* 生成规则版本：改提示词↔+1，旧缓存自动失效 */
var SHULI_SYS="你是知识图提炼助手。你只输出 JSON，不输出任何解释、开场白或 markdown 围栏。";

function loadShuliMap(){ try{ return JSON.parse(localStorage.getItem(LS_SHULI)||"{}")||{}; }catch(e){ return {}; } }
function saveShuliMap(m){ try{ localStorage.setItem(LS_SHULI,JSON.stringify(m)); }catch(e){} }
function shuliCardsOf(ch){ return CARDS.filter(function(c){ return normCh(c.ch)===ch && !c.isDetail; }); }
function shuliSigOf(ch){ return shuliCardsOf(ch).map(function(c){return c.id;}).sort().join(","); }
function shuliTopicSig(cards){ return cards.map(function(c){return c.id;}).sort().join(","); }
function shuliKindName(t){ return t==="table"?"对比表":(t==="mind"?"导图":"流程图"); }
function shuliFigName(g){ return "「"+esc(g.title)+"」"+shuliKindName(g.type); }
/* 渲染用：全部主题（含没卡的空主题、含未分类）；生成用：只挑有卡的主题 */
function shuliTopicAll(ch){
  var d=buildChannelTree(ch),arr=[];
  d.topics.forEach(function(t){ arr.push({id:t.id,name:t.name,cards:t.cards||[]}); });
  if(d.unmatched.length) arr.push({id:"__unmatched__",name:"未分类",cards:d.unmatched});
  return arr;
}
function shuliTopicGen(ch){ return shuliTopicAll(ch).filter(function(t){return t.cards.length;}); }

/* ---- 提示词（真调 AI 探针验证过的版本） ---- */
function shuliCardLine(c,i){
  return (i+1)+".《"+String(c.title||"").slice(0,60)+"》\n"
       +"  摘要："+String(c.sum||c.note||"").slice(0,90)+"\n"
       +"  标签："+(Array.isArray(c.tags)?c.tags.slice(0,6).join("、"):"");
}
function shuliMainPrompt(cards){
  return "下面是用户一个知识频道里学过的全部卡片。判断这些卡片之间有没有一条「贯穿多个主题的先后主线」（一件事要走完的几道工序 / 步骤）。\n\n"
    +"【卡片清单】\n"+cards.map(shuliCardLine).join("\n")+"\n\n"
    +"【输出】只输出下面这个 JSON（不要 markdown 围栏、不要任何解释）：\n"
    +'{"flow":{"title":"10~20字","d":"把这条主线讲透的一段话，60~100字","steps":[{"t":"步骤名(6字内)","d":"一句话(25字内)"}],"from":[1,3]}}\n'
    +'如果这些卡片之间没有明显的主线，就输出：\n{"flow":null}\n\n'
    +"【硬性要求】① steps 3~5 步，顺序必须真的从前到后；② 只根据卡片真实内容；③ 没有主线就 null，不要硬凑；④ 只输出 JSON。";
}
function shuliTopicPrompt(cards,topicName){
  return "下面是一个知识频道里「"+topicName+"」主题下用户学过的卡片。请判断这些卡片之间是什么关系，提炼成 1~2 张「一眼能扫懂」的图——能 2 张就 2 张。\n\n"
    +"【可选图型】\n"
    +"- flow：卡片之间存在先后 / 步骤关系（先做 A 才能做 B）\n"
    +"- mind：一个东西包含哪些子项（\"都有什么\"）\n"
    +"- table：两张卡在讲容易混淆的一对概念（A vs B）\n\n"
    +"【卡片清单】\n"+cards.map(shuliCardLine).join("\n")+"\n\n"
    +"【输出】只输出下面这个 JSON（不要 markdown 围栏、不要任何解释文字）：\n"
    +'{"graphs":[{"type":"mind","title":"8~16字","d":"把这张图讲透的一段话，60~120字","root":"中心词","branches":[{"name":"分支名","items":["子项1","子项2"]}],"from":[1,2]},{"type":"table","title":"8~16字","d":"把这张图讲透的一段话，60~120字","cols":["左列名","右列名"],"rows":[{"label":"行标签","cells":["左格","右格"]}],"from":[1,3]}]}\n\n'
    +"三种图型各自用这些字段（按 type 选其一）：\n"
    +"- table：cols(2个) + rows(2~4行，每行 label + cells两个)\n"
    +"- mind：root(中心词) + branches(2~4个，每个 {name, items:[2~4个短词]})\n"
    +"- flow：steps(3~5个，每个 {t:短名, d:一句话}) + note(可选，一句提醒)\n\n"
    +"【提炼要领】\n"
    +"① 如果卡片里有「串讲 / 知识地图 / 小测验 / 复习」类的总览卡，优先以它的框架为骨架——这类卡就是为\"串联\"准备的；\n"
    +"② 做对比表时，优先挑一对\"同宗同源又明显区别\"的易混概念，行标签用具体维度（如：一句话 / 常见做法 / 怎么配合），不要做\"概念/定义\"这种清单表；\n"
    +"③ 做思维导图时，分支要归纳成 2~4 个\"类别\"，不要把每张卡名平铺成分支。\n\n"
    +"【硬性要求】\n"
    +"① 只根据卡片真实内容提炼，不编造；不要画「学习过程 / 学习阶段」这类流程图（那是学习安排，不是知识关系）；\n"
    +"② title、d、from 三个字段每张图都必须有，d 写 60~120 字；\n"
    +"③ 一个主题 1~2 张图；关系不够就 1 张；实在没有就输出 {\"graphs\":[]}；\n"
    +"④ from 填卡片清单序号；⑤ 只输出 JSON，不能有任何别的文字。";
}
/* ---- 解析 + 规范化（AI 输出不完全可靠，逐字段校验兜底） ---- */
function parseShuliJSON(t){
  t=String(t||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
  var a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<0) return null;
  try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ return null; }
}
function shuliFromCards(from,cards){
  var ids=[];
  (Array.isArray(from)?from:[]).forEach(function(n){ var i=parseInt(n,10)-1; if(cards[i]&&ids.indexOf(cards[i].id)<0) ids.push(cards[i].id); });
  return ids.length?ids:cards.map(function(c){return c.id;});
}
function shuliNormFlow(f,cards){
  if(!f||!Array.isArray(f.steps)) return null;
  var steps=f.steps.filter(function(x){return x&&x.t;}).slice(0,6).map(function(x){return {t:String(x.t).slice(0,12),d:String(x.d||"").slice(0,42)};});
  if(steps.length<3) return null;
  return {type:"flow",title:String(f.title||"这个频道的主线").slice(0,30),d:String(f.d||"").slice(0,200),steps:steps,note:f.note?String(f.note).slice(0,60):"",cards:shuliFromCards(f.from,cards)};
}
function shuliNormGraphs(gs,cards){
  var out=[];
  (Array.isArray(gs)?gs:[]).forEach(function(g){
    if(!g||!g.type) return;
    var gg={type:g.type,title:String(g.title||"").slice(0,24),d:String(g.d||"").slice(0,220)};
    if(g.type==="table"){
      if(!Array.isArray(g.cols)||g.cols.length<2||!Array.isArray(g.rows)||!g.rows.length) return;
      gg.cols=g.cols.slice(0,2).map(function(x){return String(x).slice(0,10);});
      gg.rows=g.rows.slice(0,5).map(function(r){return {label:String((r&&r.label)||"").slice(0,8),cells:((r&&Array.isArray(r.cells))?r.cells:[]).slice(0,2).map(function(c){return String(c).slice(0,60);})};}).filter(function(r){return r.cells.length===2;});
      if(!gg.rows.length) return;
    }else if(g.type==="mind"){
      if(!g.root) return;
      gg.root=String(g.root).slice(0,12);
      gg.branches=(Array.isArray(g.branches)?g.branches:[]).slice(0,5).map(function(b){return {name:String((b&&b.name)||"").slice(0,10),items:((b&&Array.isArray(b.items))?b.items:[]).slice(0,6).map(function(x){return String(x).slice(0,12);})};}).filter(function(b){return b.name;});
      if(!gg.branches.length) return;
    }else if(g.type==="flow"){
      gg.steps=(Array.isArray(g.steps)?g.steps:[]).slice(0,6).map(function(x){return {t:String((x&&x.t)||"").slice(0,14),d:String((x&&x.d)||"").slice(0,42)};}).filter(function(x){return x.t;});
      if(gg.steps.length<2) return;
      gg.note=g.note?String(g.note).slice(0,60):"";
    }else return;
    if(!gg.title) gg.title=(g.type==="table"?"概念对比":(g.type==="mind"?"知识结构":"先后关系"));
    gg.cards=shuliFromCards(g.from,cards);
    out.push(gg);
  });
  return out.slice(0,2);
}
/* ---- 生成：主线一次 + 逐主题（增量：只重跑签名变了的主题） ---- */
function shuliGen(ch,force){
  if(_shuliBusy[ch]) return;
  if(_shuliFail[ch]&&!force) return;
  var cards=shuliCardsOf(ch);
  if(!cards.length) return;
  var map=loadShuliMap(),cur=map[ch],sig=shuliSigOf(ch);
  if(!force&&cur&&cur.ver===SHULI_GEN_VER&&cur.sig===sig&&cur.done) return;
  if(!cur||cur.ver!==SHULI_GEN_VER){ cur={ver:SHULI_GEN_VER,sig:sig,t:Date.now(),mainSig:null,mainline:null,topics:{}}; }
  cur.sig=sig; delete cur.fail;
  if(force){ cur.mainSig=null; cur.mainline=null; cur.topics={}; cur.done=false; }
  delete _shuliFail[ch];
  _shuliBusy[ch]=true;
  var topics=shuliTopicGen(ch),topicI=0,tryN=0,errN=0;
  function persist(){ var m=loadShuliMap(); m[ch]=cur; saveShuliMap(m); }
  function finish(){
    delete _shuliBusy[ch]; delete _shuliProg[ch];
    if(tryN>0&&errN>=tryN){ cur.fail=true; cur.done=false; _shuliFail[ch]=true; }
    persist(); renderShuli();
  }
  function stage(){
    if(cur.mainSig!==sig){
      cur.mainSig=sig; _shuliProg[ch]="正在通读全部卡片…"; persist(); renderShuli();
      tryN++;
      callAI(shuliMainPrompt(cards),SHULI_SYS,true).then(function(txt){
        var j=parseShuliJSON(txt);
        cur.mainline=(j&&j.flow)?shuliNormFlow(j.flow,cards):null;
      }).catch(function(){ errN++; cur.mainSig=null; }).then(function(){ persist(); stage(); });
      return;
    }
    if(topicI>=topics.length){ cur.done=true; persist(); finish(); return; }
    var t=topics[topicI++];
    var sub=shuliTopicSig(t.cards),td=cur.topics[t.id];
    if(td&&td.sig===sub){ stage(); return; }
    _shuliProg[ch]="正在提炼「"+t.name+"」…（"+topicI+"/"+topics.length+"）"; renderShuli();
    tryN++;
    callAI(shuliTopicPrompt(t.cards,t.name),SHULI_SYS,true).then(function(txt){
      var j=parseShuliJSON(txt);
      cur.topics[t.id]={sig:sub,graphs:(j&&j.graphs)?shuliNormGraphs(j.graphs,t.cards):[]};
    }).catch(function(){ errN++; }).then(function(){ persist(); stage(); });
  }
  persist();
  stage();
}
function shuliRedo(){
  var ch=treeCh;
  if(_shuliBusy[ch]) return;
  shuliGen(ch,true);
}
/* ---- 渲染：大盘（主线+各主题的图）/ 细盘（某主题的图）---- */
function shuliGraphHTML(gid,g){
  _shuliGraphs[gid]=g;
  var h='<div class="sh-graph" data-shread="'+esc(gid)+'">';
  /* 类型角标：标题里已经带了"流程/导图/对比"，就不再重复标一次 */
  var badge=shuliKindName(g.type);
  if(g.type==="flow"&&/流程/.test(g.title)) badge="";
  if(g.type==="mind"&&/导图/.test(g.title)) badge="";
  if(g.type==="table"&&/对比表|对照/.test(g.title)) badge="";
  h+='<div class="shgt">'+esc(g.title)+(badge?'<span class="shgk">'+badge+'</span>':'')+'</div>';
  if(g.type==="flow"){
    (g.steps||[]).forEach(function(s,i){
      if(i) h+='<div class="sh-fa"></div>';
      h+='<div class="sh-step"><span class="n">'+(i+1)+'</span><span class="mid"><span class="tt">'+esc(s.t)+'</span>'+(s.d?'<div class="dd">'+esc(s.d)+'</div>':'')+'</span></div>';
    });
    if(g.note) h+='<div class="sh-note">'+esc(g.note)+'</div>';
  }else if(g.type==="mind"){
    h+='<div class="sh-mroot">'+esc(g.root)+'</div>';
    (g.branches||[]).forEach(function(b){
      h+='<div class="sh-mbr"><span class="bl">'+esc(b.name)+'</span><span class="chips">'+(b.items||[]).map(function(it){return '<span class="sh-chip">'+esc(it)+'</span>';}).join("")+'</span></div>';
    });
  }else{
    h+='<div class="sh-cmp">';
    h+='<div class="row hd"><span class="c lb"></span><span class="c c2">'+esc(g.cols[0])+'</span><span class="c c3">'+esc(g.cols[1])+'</span></div>';
    (g.rows||[]).forEach(function(r){
      h+='<div class="row"><span class="c lb">'+esc(r.label)+'</span><span class="c">'+esc(r.cells[0])+'</span><span class="c">'+esc(r.cells[1])+'</span></div>';
    });
    h+='</div>';
  }
  h+='<div class="sh-tap">点这张图 → 读一段讲透的话、翻回原卡 ›</div>';
  return h+'</div>';
}
function renderShuli(){
  if(curView!=="tree"||treeMode!=="shuli") return;
  var box=document.getElementById("shuliBody");if(!box) return;
  var ch=treeCh,cards=shuliCardsOf(ch),map=loadShuliMap(),d=map[ch];
  var busy=!!_shuliBusy[ch],sig=shuliSigOf(ch);
  var fresh=!!(d&&d.ver===SHULI_GEN_VER&&d.sig===sig&&d.done);
  if(cards.length&&!busy&&!fresh&&!_shuliFail[ch]){ shuliGen(ch); busy=!!_shuliBusy[ch]; }
  if(!cards.length){
    box.innerHTML='<div class="sh-empty">这个频道还没有可梳理的卡片。<br>去「今日」学几张，这里就会长出图来。</div>';
    return;
  }
  if(!d||d.ver!==SHULI_GEN_VER){
    if(_shuliFail[ch]&&!busy){
      box.innerHTML='<div class="sh-empty">这次没提炼出来（可能是网络抖了一下）。<br><button data-shredo="1">重新提炼 ›</button></div>';
    }else{
      box.innerHTML='<div class="sh-load"><div class="ld"><i></i><i></i><i></i></div>正在通读你的卡片、提炼成图…<br><span style="font-size:11px;color:var(--ink-3)">'+esc(_shuliProg[ch]||"")+'&nbsp;</span></div>';
    }
    return;
  }
  _shuliGraphs={};
  var topics=shuliTopicAll(ch),h=[],gCount=0;
  topics.forEach(function(t){ var td=d.topics[t.id]; if(td&&td.graphs) gCount+=td.graphs.length; });
  if(d.mainline) gCount++;
  if(d.fail&&!busy&&!gCount){
    box.innerHTML='<div class="sh-empty">这次没提炼出来（可能是网络抖了一下）。<br><button data-shredo="1">重新提炼 ›</button></div>';
    return;

function cleanKpTitle(t){
  t=String(t||"").trim();
  for(var k=0;k<4;k++){                 /* 循环剥壳：多层套娃一次剥干净 */

    else if((m=/^你问[：:]\s*[「【]([\s\S]+?)[」】]$/.exec(t))) t=m[1].trim();
    else if((m=/^[\s\S]*?[「【]([\s\S]+?)[」】]详解$/.exec(t))) t=m[1].trim();
    if(t===before) break;

}

     不靠问题首句切分（切出来文本各异，并不了组）。无卡且没手填时统一归「未分类」。 */

function backfillAnswers(){
  /* feed 是频道官推：把 feed.json 里带原题(q)的答案卡，回填到对应提问。
     分工原则：一条提问只由一端回答——若已被本地 genDetail 生成详解(detailCardId 存在)，feed 不再写，避免双份答案。 */
  var qa=loadQA(); if(!qa.length)return;
  var byQ={}; qa.forEach(function(it){byQ[it.q.trim().toLowerCase()]=it;});
  var changed=false;
  CARDS.forEach(function(c){
    if(!c.q)return;
    var key=c.q.trim().toLowerCase();
    var it=byQ[key]; if(!it)return;
    if(it.detailCardId) return; /* 已被 genDetail 生成详解，feed 让位 */
    /* 已归档（已读 / 已忽略）的不再改动：否则用户收起来的问答，
       会被随后推下来的官推答案卡打回「已推送」，重新冒到列表里。 */
    var _st=qaState(it); if(_st==="read"||_st==="ignored") return;
    var ans=Array.isArray(c.body)?c.body.join("\n"):(c.note||c.sum||"");
    it.a=ans; it.state="pushed"; it.detailCardId=c.id;
    changed=true;
    addFocus(it.kp||"未分类", it.q, c.ch||"ai");
  });
  if(changed){saveQA(qa);updateQaBdg();}
}
/* 云端知识库：拉取 user_kb.json 合并到本地（换设备 / 清缓存后可恢复）
   【关键】云端那份是「历史快照」——它没有 state / detailCardId，而且之后再没更新过。
   所以合并必须「本地优先」：同一条问题，本地有就以本地为准（保住已读 / 已忽略 / 详解链接），
   本地没有才把云端那条补进来。否则每刷新一次，本地的归档就被云端旧快照冲回列表一次。 */

   为什么会有重复：旧版没有"正在生成中"的挡板，同一批待生成提问会被反复抓取，
   一次生成好几张标题一模一样的卡（实测可到 4 张）。

   没有被指向的就留最新的那张。 */
function _detSig(d){var f=d&&d.fromQids;return (f&&f.length)?f.slice().sort().join("|"):"";}
function dedupeDetailCards(){
  var pointed={};
  try{ loadQA().forEach(function(x){ if(x&&x.detailCardId) pointed[x.detailCardId]=1; }); }catch(e){}
  var rep={},sig={};
  for(var i=0;i<CARDS.length;i++){

    var s=_detSig(c); if(!s) continue;                 /* 老卡没有 fromQids → 视为唯一，不去重 */
    sig[c.id]=s;
    if(!rep[s]) rep[s]=c;                              /* 默认留最先遇到的（CARDS 已按新→旧） */
    if(pointed[c.id]) rep[s]=c;                        /* 有问答条目指着它，优先留它 */
  }

 "③ 重要知识标明来源：涉及政策法规、行业数据、机构动态、技术标准、健康法律等严肃内容，必须注明来源（机构或媒体名 + 日期 + 链接）；拿不到链接就写「来源：XX 报道，未取得原文链接」。" +
 "④ 依据不足就直说：信息不够时明确说「这点我不确定，建议进一步核实 / 请补充一句背景」，绝不编造凑数。";
function callAI(prompt, system, plain){ /* 真实接腾讯云 CloudBase 中转层（密钥在服务端，前端零密钥；可选 RELAY_TOKEN 口令校验）
  plain=true 时不追加 AI_ANS_FMT（用于「只要一句摘要」这类单值请求，避免它又按"摘要/导读/分点/标签"整套作答） */
  return fetch(AI_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: prompt, system: (system || '你是个人知识助教，用简体中文把话讲完整、讲准确，按问题的类型给足深度。') + '\n\n' + AI_TRUTH + (plain ? '' : AI_ANS_FMT), token: SETTINGS.relayToken }),
