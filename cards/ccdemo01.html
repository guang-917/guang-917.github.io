<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">

<title>CCAA 备考 · 卡片格式样板</title><style>
body{margin:0;padding:20px 14px 40px;background:#F2F6FB;color:#12293F;

.wrap{max-width:420px;margin:0 auto;background:#fff;border:1px solid #D3E2F1;border-radius:14px;
 overflow:hidden;box-shadow:0 6px 22px rgba(20,98,172,.10)}
.hd{background:linear-gradient(180deg,#FDFEFF,#ECF4FC);border-left:5px solid #1F6FB2;

<div class="hd"><h1>格式样板 · 不是知识点</h1><p>sample=true，推送时会被自动跳过</p></div>
<div class="bd">
<p>这张卡只用于说明 CCAA 卡池的字段结构，不会出现在手机推送里。</p>
<p><span class="k">seq</span>推送顺序，null 表示尚未排入序列</p>
<p><span class="k">point</span>大纲细项号，如 3.1.5-a</p>
<p><span class="k">level</span>考频等级：S / A / B / C / 未考</p>
<p><span class="k">html</span>本页完整源码，推送时原样上传</p>
</div></div></body></html>
