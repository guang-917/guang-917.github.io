<h2>架构和建模的边界怎么记？</h2>
<p>把公司盖楼打比方：数据架构是“总体规划师”——画总平面图（企业数据模型、数据流设计），回答“整个企业数据长什么样、往哪流”；数据建模是“具体楼盘的设计师”——出施工图（概念/逻辑/物理模型），回答“这一块地怎么建”。</p>
<p>所以教材把物理数据模型归为“数据建模和设计的产物”：它是针对某个具体系统落地的详细技术方案，不是企业级蓝图的一部分。数据架构的交付成果是企业数据模型、数据流设计这些“全局图”；物理模型和逻辑模型是建模阶段的交付物。</p>
<p>一句话记忆：全局归架构，落地归建模；问“架构交付成果”时，凡是只属于单个系统落地的（物理模型），都别选。</p>
